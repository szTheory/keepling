        applies-to: "version-updates"
        update-types: ["minor", "patch"]

  - package-ecosystem: "opentofu"
    directory: "/infra/tofu/hetzner"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 1
