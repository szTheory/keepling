      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 3
    groups:
      routine-minor-patch:
        applies-to: "version-updates"
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker-compose"
