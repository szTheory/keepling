version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 3
    groups:
      routine-minor-patch:
        applies-to: "version-updates"
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 3
    groups:
      routine-minor-patch:
        applies-to: "version-updates"
        update-types: ["minor", "patch"]

  - package-ecosystem: "mix"
    directory: "/apps/server"
