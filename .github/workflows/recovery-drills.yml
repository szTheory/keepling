name: Protected recovery drills

on:
  schedule:
    - cron: "15 5 * * *"
    - cron: "45 5 * * 0"
  workflow_dispatch:
    inputs:
      drill:
        description: Exact protected drill to run
        required: true
        type: choice
        options: [newest-logical, latest-wal, historical-pitr, host-replacement]
      change_trigger:
        description: Reviewed provider/bootstrap/recovery/DNS change reference; required for host replacement
        required: false
        type: string

permissions:
  contents: read

env:
  KEEPLING_RESTORE_SEED: "20260901"
  KEEPLING_FLAKE_POLICY: "single-attempt; no-retry; teardown-required"

jobs:
  daily-restore:
    if: github.event.schedule == '15 5 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.drill == 'newest-logical' || inputs.drill == 'latest-wal'))
    environment: recovery-protected
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fixture: [newest-logical, latest-wal]
    env:
      KEEPLING_BACKUP_PRIMARY_ENDPOINT: ${{ secrets.KEEPLING_BACKUP_PRIMARY_ENDPOINT }}
      KEEPLING_BACKUP_PRIMARY_REGION: ${{ secrets.KEEPLING_BACKUP_PRIMARY_REGION }}
      KEEPLING_BACKUP_PRIMARY_ACCESS_KEY: ${{ secrets.KEEPLING_BACKUP_PRIMARY_ACCESS_KEY }}
      KEEPLING_BACKUP_PRIMARY_SECRET_KEY: ${{ secrets.KEEPLING_BACKUP_PRIMARY_SECRET_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.asdf/installs
            apps/server/deps
            apps/server/_build
          key: recovery-${{ runner.os }}-${{ hashFiles('tooling/runtime-versions.env', 'apps/server/mix.lock') }}
      - name: Provision exact repository runtimes
        run: |
          brew list asdf >/dev/null 2>&1 || brew install asdf
          ./tooling/runtime-preflight.sh --provision
          ./tooling/runtime-preflight.sh --exec -- sh -c 'cd apps/server && mix deps.get --check-locked'
      - name: Run one protected restore fixture and retain bounded evidence
        run: |
          set -eu
          evidence="$RUNNER_TEMP/${{ matrix.fixture }}.json"
          started=$(date +%s)
          missing=0
          for name in KEEPLING_BACKUP_PRIMARY_ENDPOINT KEEPLING_BACKUP_PRIMARY_REGION KEEPLING_BACKUP_PRIMARY_ACCESS_KEY KEEPLING_BACKUP_PRIMARY_SECRET_KEY; do
            test -n "$(printenv "$name")" || missing=1
          done
          if test "$missing" -ne 0; then
            jq -n '{version:1,fixture:"${{ matrix.fixture }}",result:"NON_PASSING",reason:"missing_protected_credentials"}' >"$evidence"
            ./tooling/verify-privacy.sh "$evidence"
            exit 1
          fi
          ./tooling/verify-restore.sh --fixture "${{ matrix.fixture }}"
          elapsed=$(( $(date +%s) - started ))
          jq -n --arg revision "$GITHUB_SHA" --argjson elapsed "$elapsed" '{version:1,fixture:"${{ matrix.fixture }}",result:"PASS",revision:$revision,elapsed_seconds:$elapsed,semantic:"complete"}' >"$evidence"
          ./tooling/verify-privacy.sh "$evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: recovery-${{ matrix.fixture }}-bounded
          path: ${{ runner.temp }}/${{ matrix.fixture }}.json
          if-no-files-found: error
          retention-days: 30

  weekly-historical-pitr:
    if: github.event.schedule == '45 5 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.drill == 'historical-pitr')
    environment: recovery-protected
    runs-on: macos-15
    timeout-minutes: 30
    env:
      KEEPLING_BACKUP_PRIMARY_ENDPOINT: ${{ secrets.KEEPLING_BACKUP_PRIMARY_ENDPOINT }}
      KEEPLING_BACKUP_PRIMARY_REGION: ${{ secrets.KEEPLING_BACKUP_PRIMARY_REGION }}
      KEEPLING_BACKUP_PRIMARY_ACCESS_KEY: ${{ secrets.KEEPLING_BACKUP_PRIMARY_ACCESS_KEY }}
      KEEPLING_BACKUP_PRIMARY_SECRET_KEY: ${{ secrets.KEEPLING_BACKUP_PRIMARY_SECRET_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.asdf/installs
            apps/server/deps
            apps/server/_build
          key: recovery-${{ runner.os }}-${{ hashFiles('tooling/runtime-versions.env', 'apps/server/mix.lock') }}
      - name: Provision exact repository runtimes
        run: |
          brew list asdf >/dev/null 2>&1 || brew install asdf
          ./tooling/runtime-preflight.sh --provision
          ./tooling/runtime-preflight.sh --exec -- sh -c 'cd apps/server && mix deps.get --check-locked'
      - name: Run one seeded historical PITR fixture
        run: |
          set -eu
          evidence="$RUNNER_TEMP/historical-pitr.json"
          missing=0
          for name in KEEPLING_BACKUP_PRIMARY_ENDPOINT KEEPLING_BACKUP_PRIMARY_REGION KEEPLING_BACKUP_PRIMARY_ACCESS_KEY KEEPLING_BACKUP_PRIMARY_SECRET_KEY; do
            test -n "$(printenv "$name")" || missing=1
          done
          if test "$missing" -ne 0; then
            jq -n '{version:1,fixture:"historical-pitr",result:"NON_PASSING",reason:"missing_protected_credentials",seed:20260901}' >"$evidence"
            ./tooling/verify-privacy.sh "$evidence"
            exit 1
          fi
          started=$(date +%s)
          ./tooling/verify-restore.sh --fixture historical-pitr
          elapsed=$(( $(date +%s) - started ))
          jq -n --arg revision "$GITHUB_SHA" --argjson elapsed "$elapsed" '{version:1,fixture:"historical-pitr",result:"PASS",revision:$revision,elapsed_seconds:$elapsed,seed:20260901,semantic:"complete"}' >"$evidence"
          ./tooling/verify-privacy.sh "$evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: recovery-historical-pitr-bounded
          path: ${{ runner.temp }}/historical-pitr.json
          if-no-files-found: error
          retention-days: 90

  quarterly-host-replacement:
    if: github.event_name == 'workflow_dispatch' && inputs.drill == 'host-replacement'
    environment: recovery-live
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      KEEPLING_LIVE_CHANGE_TRIGGER: ${{ inputs.change_trigger }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # TWO DIFFERENT CLAIMS LIVE IN THIS JOB, AND THEY MUST NOT BE CONFUSED.
      #
      # `quarterly-host-replacement` is a lane in tooling/release-lanes.json
      # whose declared command is ./tooling/test-host-replacement-sequence.sh
      # and whose `requiresSecrets` is false. It is the deterministic ordering
      # contract: gates run in order, a semantic failure never reaches DNS, and
      # teardown is guaranteed. It needs no credential and no provider. Until
      # this step existed the lane was BLOCKED for one reason only -- this job
      # exited before running the lane's own declared command, so a lane that
      # passes everywhere reported BLOCKED everywhere (window 83).
      #
      # `live-host-dns-acceptance` is a DIFFERENT lane, `requiresSecrets: true`,
      # and it is the one DATA-03 and OPS-02 depend on. It is NOT wired here and
      # is not wired anywhere, deliberately: see the step below.
      - name: Run this lane's own declared deterministic command
        run: |
          set -eu -o pipefail
          ./tooling/test-host-replacement-sequence.sh | tee "$RUNNER_TEMP/host-replacement-lane.txt"
          ./tooling/verify-privacy.sh "$RUNNER_TEMP/host-replacement-lane.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: host-replacement-lane
          path: ${{ runner.temp }}/host-replacement-lane.txt
          if-no-files-found: error
          retention-days: 90
      # THIS STEP MUST KEEP FAILING, AND THE JOB MUST KEEP REPORTING RED.
      #
      # DATA-03 and OPS-02 both state the rule in their own disclosures: the
      # credentialed live Hetzner/DNS cutover "must exist, must never report
      # green without fresh outer evidence, and is EXPECTED to be non-passing,
      # so that no skip is ever counted as evidence." A green job here would be
      # the exact vacuity those boxes were unchecked to avoid.
      #
      # The reason is now specific instead of generic. Credentials are no longer
      # the first thing missing: HCLOUD_TOKEN and CLOUDFLARE_API_TOKEN are
      # provisioned in this environment, and three of the remaining five inputs
      # have known 1Password items. The binding constraint is in the code --
      # `credentialed_apply` in tooling/verify-host-replacement.sh ends in an
      # unconditional `die`, sealed until the billable benchmark checkpoint is
      # approved by the owner. Uploading the last credentials would not move
      # this one line. So the evidence names the seal first and the missing
      # inputs second, in the order they actually bind.
      - name: Record the sealed outer acceptance as explicitly non-passing
        if: always()
        run: |
          set -eu
          evidence="$RUNNER_TEMP/host-replacement.json"
          reason=outer_acceptance_sealed
          test -n "$KEEPLING_LIVE_CHANGE_TRIGGER" || reason=change_trigger_required
          test -n "$HCLOUD_TOKEN" && test -n "$CLOUDFLARE_API_TOKEN" || reason=missing_protected_credentials
          jq -n --arg revision "$GITHUB_SHA" --arg reason "$reason" '{version:1,fixture:"host-replacement",result:"NON_PASSING",revision:$revision,reason:$reason,attempts:0,dns_reached:false,lane:"live-host-dns-acceptance",owner:"BACKLOG/999.2",sealed_at:"credentialed_apply"}' >"$evidence"
          ./tooling/verify-privacy.sh "$evidence"
          echo 'live-host-dns-acceptance remains NON_PASSING: the billable apply is sealed in code, not merely uncredentialed.'
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: host-replacement-non-passing
          path: ${{ runner.temp }}/host-replacement.json
          if-no-files-found: error
          retention-days: 90
