name: Repository integrity and Phase 2 evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  KEEPLING_PHASE2_SEED: "20260901"
  KEEPLING_FLAKE_POLICY: "no-retry; quarantine-requires-owner-issue-expiry"

jobs:
  pr-impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      run_heavy: ${{ steps.classify.outputs.run_heavy }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
      - name: Classify changed paths; uncertainty selects the full suite
        id: classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tooling/classify-pr-impact.mjs

  ci-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
      - name: Download and verify pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.12
          archive="$RUNNER_TEMP/actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint" -version | grep -F '1.7.12'
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Lint GitHub Actions workflows, expressions, and embedded shell
        run: actionlint -color
      - name: Verify committed CI contract and lane inventory
        run: node tooling/check-ci-contract.mjs && ./tooling/test-phase-2.sh --list
      # The release manifest for a revision is NOT written here. This job knows
      # the result of exactly one lane -- its own -- so any manifest it could
      # fabricate would name a single lane and omit the rest, and an omitted
      # lane reads as satisfied. The real manifest is the committed one under
      # `.planning/releases/<tag>/`, produced once every lane's result is known.
      #
      # What this job CAN prove at every revision is that the verifier still
      # refuses the two loopholes the inventory exists to close. Both fixtures
      # must be REJECTED; a fixture that starts passing means the verifier lost
      # a guard.
      - name: Prove the release verifier still refuses a vanished lane and a locally bound lane
        run: |
          # NOTE: deliberately no `set -o pipefail` here. Each fixture makes the
          # verifier exit non-zero ON PURPOSE -- that refusal IS the assertion.
          # Piping it straight into grep under pipefail fails the step precisely
          # WHEN THE GUARD WORKS, because the node exit status poisons the
          # pipeline. Capture the output first, then assert against it.
          set -u
          assert_refused() {
            fixture="$1"
            expected="$2"
            output="$(node tooling/verify-release.mjs --manifest "$fixture" --offline 2>&1)" && {
              echo "verify-release ACCEPTED $fixture; the guard is gone" >&2
              printf '%s\n' "$output" >&2
              exit 1
            }
            printf '%s\n' "$output" | grep -q "$expected" || {
              echo "verify-release refused $fixture but not for the stated reason:" >&2
              echo "  expected to find: $expected" >&2
              printf '%s\n' "$output" >&2
              exit 1
            }
          }
          assert_refused tooling/fixtures/release-manifest.vanished-lane.json 'lane vanished from manifest'
          assert_refused tooling/fixtures/release-manifest.local-unattested.json 'nothing local may bind to locally built bytes'
          assert_refused tooling/fixtures/release-manifest.not-produced-artifact.json 'a lane cannot have tested bytes that were never built'
          assert_refused tooling/fixtures/release-manifest.dangling-evidence.json 'a digest naming nothing proves nothing'
          # A blocked release record must fail without a contradictory PASSED summary.
          blocked_output="$(node tooling/verify-release.mjs --manifest .planning/releases/candidate-5/release-manifest.json --offline 2>&1)" && {
            echo 'verify-release accepted the retained blocked candidate-5 manifest' >&2
            printf '%s\n' "$blocked_output" >&2
            exit 1
          }
          printf '%s\n' "$blocked_output" | grep -Fq 'verification did not pass; see the lane and artifact failures above' || {
            echo 'verify-release did not clearly identify its expected non-passing verdict' >&2
            printf '%s\n' "$blocked_output" >&2
            exit 1
          }
          if printf '%s\n' "$blocked_output" | grep -Fq 'verification did not pass (PASSED)'; then
            echo 'verify-release contradicted its non-zero exit by reporting PASSED' >&2
            printf '%s\n' "$blocked_output" >&2
            exit 1
          fi
          echo 'release-verifier guards intact: vanished-lane=refused local-unattested=refused not-produced-artifact=refused dangling-evidence=refused'
      - name: Report the committed release evidence that exists at this revision
        run: |
          set -o pipefail
          for manifest in .planning/releases/*/release-manifest.json; do
            [ -e "$manifest" ] || continue
            echo "::group::verify-release $manifest"
            node tooling/verify-release.mjs --manifest "$manifest" --offline || echo "NON-PASSING: $manifest"
            echo "::endgroup::"
          done

  repository-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run exact repository lane
        run: |
          set -o pipefail
          ./tooling/test-phase-2.sh --lane repository-integrity | tee "$RUNNER_TEMP/repository-integrity.txt"
          ./tooling/verify-privacy.sh "$RUNNER_TEMP/repository-integrity.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-integrity-timing
          path: ${{ runner.temp }}/repository-integrity.txt
          if-no-files-found: error
          retention-days: 14

  phase2-linux:
    name: phase2-${{ matrix.lane }}
    needs: [pr-impact]
    if: always() && (needs.pr-impact.result != 'success' || needs.pr-impact.outputs.run_heavy != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [server, sync-property, backup-restore]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.asdf/installs
            apps/server/deps
            apps/server/_build
            node_modules
          key: phase2-${{ runner.os }}-${{ matrix.lane }}-${{ hashFiles('tooling/runtime-versions.env', 'apps/server/mix.lock', 'pnpm-lock.yaml') }}
      - name: Install asdf
        run: |
          set -eu
          # The cache step above restores ~/.asdf/installs, which CREATES
          # $HOME/.asdf before this step runs. An unconditional clone then dies
          # with "destination path already exists and is not an empty
          # directory" (exit 128) and the lane never reaches any project code.
          # Clone into a scratch directory and move only the parts that are
          # missing, so a restored cache and a cold runner both end up with the
          # same tree.
          if [ ! -d "$HOME/.asdf/.git" ]; then
            scratch="$(mktemp -d)"
            git clone https://github.com/asdf-vm/asdf.git "$scratch/asdf" --branch v0.14.1
            mkdir -p "$HOME/.asdf"
            # `cp -R src/. dst` merges into an existing directory instead of
            # nesting, which is what the restored-cache case needs.
            cp -R "$scratch/asdf/." "$HOME/.asdf/"
            rm -rf "$scratch"
          fi
          echo "$HOME/.asdf/bin" >> "$GITHUB_PATH"
          echo "$HOME/.asdf/shims" >> "$GITHUB_PATH"
      - name: Provision exact repository runtimes
        run: |
          ./tooling/runtime-preflight.sh --provision
          corepack enable
          pnpm install --frozen-lockfile
          ./tooling/runtime-preflight.sh --exec -- sh -c 'cd apps/server && mix deps.get --check-locked'
      - name: Run exact Phase 2 lane
        run: |
          set -o pipefail
          ./tooling/test-phase-2.sh --lane "${{ matrix.lane }}" | tee "$RUNNER_TEMP/${{ matrix.lane }}.txt"
          ./tooling/verify-privacy.sh "$RUNNER_TEMP/${{ matrix.lane }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase2-${{ matrix.lane }}-timing
          path: ${{ runner.temp }}/${{ matrix.lane }}.txt
          if-no-files-found: error
          retention-days: 14

  phase2-runtime:
    name: phase2-${{ matrix.lane }}
    needs: [pr-impact]
    if: always() && (needs.pr-impact.result != 'success' || needs.pr-impact.outputs.run_heavy != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KEEPLING_IMAGE_PLATFORM: linux/amd64
    strategy:
      fail-fast: false
      matrix:
        lane: [contracts-compatibility, privacy]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.asdf/installs
            apps/server/deps
            apps/server/_build
            node_modules
          key: phase2-${{ runner.os }}-${{ matrix.lane }}-${{ hashFiles('tooling/runtime-versions.env', 'apps/server/mix.lock', 'pnpm-lock.yaml') }}
      - name: Install asdf
        run: |
          if [ ! -d "$HOME/.asdf/.git" ]; then
            scratch="$(mktemp -d)"
            git clone https://github.com/asdf-vm/asdf.git "$scratch/asdf" --branch v0.14.1
            mkdir -p "$HOME/.asdf"
            cp -R "$scratch/asdf/." "$HOME/.asdf/"
            rm -rf "$scratch"
          fi
          echo "$HOME/.asdf/bin" >> "$GITHUB_PATH"
          echo "$HOME/.asdf/shims" >> "$GITHUB_PATH"
      - name: Provision exact repository runtimes
        run: |
          ./tooling/runtime-preflight.sh --provision
          corepack enable
          pnpm install --frozen-lockfile
          ./tooling/runtime-preflight.sh --exec -- sh -c 'cd apps/server && mix deps.get --check-locked'
      - name: Run exact Phase 2 lane
        run: |
          set -o pipefail
          ./tooling/test-phase-2.sh --lane "${{ matrix.lane }}" | tee "$RUNNER_TEMP/${{ matrix.lane }}.txt"
          ./tooling/verify-privacy.sh "$RUNNER_TEMP/${{ matrix.lane }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase2-${{ matrix.lane }}-timing
          path: ${{ runner.temp }}/${{ matrix.lane }}.txt
          if-no-files-found: error
          retention-days: 14

  phase2-verified-image:
    needs: [pr-impact]
    if: always() && (needs.pr-impact.result != 'success' || needs.pr-impact.outputs.run_heavy != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KEEPLING_IMAGE_PLATFORM: linux/amd64
      KEEPLING_IMAGE_TAG: keepling-server:plan-02-09-amd64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
      - name: Install locked JavaScript inputs
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Run exact image, Compose, and deploy lane
        run: |
          set -o pipefail
          ./tooling/test-phase-2.sh --lane image-compose-deploy | tee "$RUNNER_TEMP/image-compose-deploy.txt"
          ./tooling/verify-privacy.sh "$RUNNER_TEMP/image-compose-deploy.txt"
      - name: Export exact tested Phase 2 image and contract
        run: |
          set -eu
          source_revision=$(git rev-parse HEAD)
          [ "$source_revision" = "$GITHUB_SHA" ] || { echo "::error::checked-out source revision does not match this workflow event"; exit 1; }
          output="$RUNNER_TEMP/phase2-verified-image"
          mkdir -m 700 "$output"
          archive="$output/keepling-server-amd64.tar.gz"
          contract="$output/image-contract.json"
          binding="$output/run-binding.json"
          ./tooling/export-verified-image-archive.sh "$KEEPLING_IMAGE_TAG" "$archive"
          ./tooling/verify-host-replacement.sh --resolve-image-archive "$archive" "$contract" >/dev/null
          jq -e --arg revision "$source_revision" '.version == 2 and .revision == $revision and .architecture == "amd64" and .os == "linux" and (.archive_sha256 | test("^[0-9a-f]{64}$")) and (.manifest_digest | test("^sha256:[0-9a-f]{64}$")) and (.rootfs_diff_ids | type == "array" and length > 0)' "$contract" >/dev/null
          archive_bytes=$(stat -c '%s' "$archive")
          if [ "$archive_bytes" -le 0 ] || [ "$archive_bytes" -gt 1073741824 ]; then
            echo "::error::verified image archive is outside the 1 GiB artifact limit" >&2
            exit 1
          fi
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg source_revision "$source_revision" \
            --arg archive_sha256 "$(jq -r .archive_sha256 "$contract")" \
            --arg image_manifest_digest "$(jq -r .manifest_digest "$contract")" \
            '{version:1,run_id:$run_id,run_attempt:$run_attempt,source_revision:$source_revision,archive_sha256:$archive_sha256,image_manifest_digest:$image_manifest_digest}' \
            > "$binding"
          chmod 600 "$binding"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase2-verified-image
          path: |
            ${{ runner.temp }}/phase2-verified-image/keepling-server-amd64.tar.gz
            ${{ runner.temp }}/phase2-verified-image/image-contract.json
            ${{ runner.temp }}/phase2-verified-image/run-binding.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-compose-deploy-timing
          path: ${{ runner.temp }}/image-compose-deploy.txt
          if-no-files-found: error
          retention-days: 14


  image-compose-deploy:
    needs: [pr-impact]
    if: always() && (needs.pr-impact.result != 'success' || needs.pr-impact.outputs.run_heavy != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KEEPLING_IMAGE_PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run source-bound native x64 image, reload, deploy, and synthetic recovery proof
        run: ./tooling/verify-phase-2-gate-b.sh "$RUNNER_TEMP/phase-2-gate-b.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-2-gate-b-route-evidence
          path: ${{ runner.temp }}/phase-2-gate-b.json
          if-no-files-found: error
          retention-days: 14

  opentofu-host-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run exact hermetic host-boundary lane
        run: |
          set -o pipefail
          ./tooling/test-phase-2.sh --lane opentofu-host-fixtures | tee "$RUNNER_TEMP/opentofu-host-fixtures.txt"
          ./tooling/verify-privacy.sh "$RUNNER_TEMP/opentofu-host-fixtures.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opentofu-host-fixtures-timing
          path: ${{ runner.temp }}/opentofu-host-fixtures.txt
          if-no-files-found: error
          retention-days: 14

  # D-15(a)/(b): this is the required repository summary. `if: always()`
  # keeps the check present when dependencies fail. The result verifier only
  # accepts skips for the gated heavy jobs after a successful docs-only
  # classification; every always-run dependency must still succeed.
  export-reader:
    # D-07 lane 3. The independent export reader has existed and passed
    # locally since 06-08, and was BLOCKED in both release candidates for one
    # reason only: no committed job ran it, and an unwired lane may never
    # report PASSED (window 83). It needs nothing but Node and a checked-in
    # vector, so it runs as its own job rather than as a step inside another
    # one -- a lane the aggregator names by itself cannot be lost in someone
    # else's log.
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
      - name: Validate the golden export bundle by an independent route
        run: |
          set -o pipefail
          node tooling/verify-export-reader.mjs --golden | tee "$RUNNER_TEMP/export-reader.txt"
          ./tooling/verify-privacy.sh "$RUNNER_TEMP/export-reader.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: export-reader-timing
          path: ${{ runner.temp }}/export-reader.txt
          if-no-files-found: error
          retention-days: 14

  all-required-passed:
    name: All required checks passed
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    needs:
      [pr-impact, ci-contract, repository-integrity, phase2-linux, phase2-runtime, phase2-verified-image, image-compose-deploy, opentofu-host-fixtures, export-reader]
    if: always()
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Assert required checks succeeded or approved documentation skips were recorded
        env:
          NEEDS_CONTEXT: ${{ toJSON(needs) }}
        run: >-
          node tooling/check-ci-results.mjs --impact-job=pr-impact
          --always=ci-contract,repository-integrity,opentofu-host-fixtures,export-reader
          --conditional=phase2-linux,phase2-runtime,phase2-verified-image,image-compose-deploy
