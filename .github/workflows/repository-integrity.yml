name: Repository integrity and Phase 2 evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  KEEPLING_PHASE2_SEED: "20260901"
  KEEPLING_FLAKE_POLICY: "no-retry; quarantine-requires-owner-issue-expiry"

jobs:
  ci-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
      - name: Verify committed CI contract and lane inventory
        run: ./tooling/check-ci-contract.mjs && ./tooling/test-phase-2.sh --list

  repository-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run exact repository lane
        run: |
          set -o pipefail
          ./tooling/test-phase-2.sh --lane repository-integrity | tee "$RUNNER_TEMP/repository-integrity.txt"
          ./tooling/verify-privacy.sh "$RUNNER_TEMP/repository-integrity.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-integrity-timing
          path: ${{ runner.temp }}/repository-integrity.txt
          if-no-files-found: error
          retention-days: 14

  phase2-runtime:
    name: phase2-${{ matrix.lane }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [server, sync-property, contracts-compatibility, backup-restore, privacy]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.asdf/installs
            apps/server/deps
            apps/server/_build
            node_modules
          key: phase2-${{ runner.os }}-${{ matrix.lane }}-${{ hashFiles('tooling/runtime-versions.env', 'apps/server/mix.lock', 'pnpm-lock.yaml') }}
      - name: Provision exact repository runtimes
        run: |
          brew list asdf >/dev/null 2>&1 || brew install asdf
          ./tooling/runtime-preflight.sh --provision
          corepack enable
          pnpm install --frozen-lockfile
          ./tooling/runtime-preflight.sh --exec -- sh -c 'cd apps/server && mix deps.get --check-locked'
      - name: Run exact Phase 2 lane
        run: |
          set -o pipefail
          ./tooling/test-phase-2.sh --lane "${{ matrix.lane }}" | tee "$RUNNER_TEMP/${{ matrix.lane }}.txt"
          ./tooling/verify-privacy.sh "$RUNNER_TEMP/${{ matrix.lane }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase2-${{ matrix.lane }}-timing
          path: ${{ runner.temp }}/${{ matrix.lane }}.txt
          if-no-files-found: error
          retention-days: 14

  image-compose-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KEEPLING_IMAGE_PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
      - name: Install locked JavaScript inputs
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Run exact image, Compose, and deploy lane
        run: |
          set -o pipefail
          ./tooling/test-phase-2.sh --lane image-compose-deploy | tee "$RUNNER_TEMP/image-compose-deploy.txt"
          ./tooling/verify-privacy.sh "$RUNNER_TEMP/image-compose-deploy.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-compose-deploy-timing
          path: ${{ runner.temp }}/image-compose-deploy.txt
          if-no-files-found: error
          retention-days: 14

  opentofu-host-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run exact hermetic host-boundary lane
        run: |
          set -o pipefail
          ./tooling/test-phase-2.sh --lane opentofu-host-fixtures | tee "$RUNNER_TEMP/opentofu-host-fixtures.txt"
          ./tooling/verify-privacy.sh "$RUNNER_TEMP/opentofu-host-fixtures.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opentofu-host-fixtures-timing
          path: ${{ runner.temp }}/opentofu-host-fixtures.txt
          if-no-files-found: error
          retention-days: 14
