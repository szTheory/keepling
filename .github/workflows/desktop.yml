name: Desktop packaged evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  KEEPLING_DESKTOP_ARTIFACT_ROOT: keepling-desktop-package

jobs:
  desktop-units:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
      - name: Install locked JavaScript inputs
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Run contracts, pure/store/worker/ipc/performance vitest lanes, and both typechecks
        run: |
          set -o pipefail
          pnpm contracts:check
          pnpm test:desktop
          pnpm test:desktop:ipc
          pnpm typecheck:desktop
          pnpm typecheck:web

  # This IS the required "desktop-packaged" CI artifact lane the phase plan
  # calls for: package builds ONCE, uploads the exact bytes + immutable
  # manifest, and every downstream job downloads that SAME artifact into a
  # distinct directory rather than rebuilding. Promotion (below) accepts
  # only the digest this job recorded.
  desktop-package:
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      application-digest: ${{ steps.package.outputs.application-digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
      - name: Install locked JavaScript inputs
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build once and record the immutable package manifest
        id: package
        run: |
          set -o pipefail
          pnpm package:desktop | tee "$RUNNER_TEMP/package.txt"
          manifest_path=$(grep -o '/.*/package-manifest.json' "$RUNNER_TEMP/package.txt" | tail -1)
          artifact_root=$(dirname "$manifest_path")
          echo "manifest-path=$manifest_path" >> "$GITHUB_OUTPUT"
          echo "artifact-root=$artifact_root" >> "$GITHUB_OUTPUT"
          digest=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')).applicationDigestSha256)" "$manifest_path")
          echo "application-digest=$digest" >> "$GITHUB_OUTPUT"
          archive_path=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')).archivePath)" "$manifest_path")
          # T-06-02-01: stage ONLY the manifest and the `ditto` transport
          # archive -- a single regular file -- rather than the raw `.app`
          # directory tree `actions/upload-artifact`'s own zip previously
          # lost mode bits and symlinks from. Every downstream job expands
          # this archive itself and re-verifies against
          # `applicationDigestSha256` (see `smoke-desktop-packaged.mjs` and
          # `verify-macos-integration.mjs`).
          mkdir -p "$RUNNER_TEMP/${KEEPLING_DESKTOP_ARTIFACT_ROOT}"
          cp "$manifest_path" "$RUNNER_TEMP/${KEEPLING_DESKTOP_ARTIFACT_ROOT}/"
          cp "$archive_path" "$RUNNER_TEMP/${KEEPLING_DESKTOP_ARTIFACT_ROOT}/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.KEEPLING_DESKTOP_ARTIFACT_ROOT }}
          path: ${{ runner.temp }}/${{ env.KEEPLING_DESKTOP_ARTIFACT_ROOT }}
          if-no-files-found: error
          retention-days: 14

  # Test jobs NEVER rebuild and NEVER invoke `pnpm package:desktop` -- they
  # only download the exact bytes `desktop-package` produced and rewrite the
  # manifest's absolute paths to match this job's own download location
  # (the build job's paths are ephemeral to its own runner and never exist
  # on a different runner).
  desktop-packaged:
    needs: [desktop-package]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
      - name: Install locked JavaScript inputs
        run: corepack enable && pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.KEEPLING_DESKTOP_ARTIFACT_ROOT }}
          path: ${{ runner.temp }}/${{ env.KEEPLING_DESKTOP_ARTIFACT_ROOT }}
      - name: Rebase the downloaded manifest onto this job's own artifact directory
        id: rebase
        run: |
          set -o pipefail
          artifact_root="$RUNNER_TEMP/${KEEPLING_DESKTOP_ARTIFACT_ROOT}"
          chmod -R u+x "$artifact_root"
          node -e "
            const fs = require('node:fs');
            const path = require('node:path');
            const root = process.argv[1];
            const manifestPath = path.join(root, 'package-manifest.json');
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            // T-06-02-01: only the transport archive -- a single regular
            // file -- was actually staged and downloaded onto this runner.
            // The raw .app directory this manifest's copiedApplicationPath
            // names was the BUILD job's ephemeral tree and does not exist
            // here; the consuming scripts (smoke-desktop-packaged.mjs,
            // verify-macos-integration.mjs) expand archivePath themselves
            // and re-verify against applicationDigestSha256, so
            // copiedApplicationPath/executablePath are left as recorded.
            const archiveName = path.basename(manifest.archivePath);
            manifest.archivePath = path.join(root, archiveName);
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
            console.log(manifestPath);
          " "$artifact_root" | tee "$RUNNER_TEMP/rebase.txt"
          echo "manifest-path=$artifact_root/package-manifest.json" >> "$GITHUB_OUTPUT"
      - name: Run every packaged Playwright spec against the exact downloaded bytes
        run: node tooling/smoke-desktop-packaged.mjs --manifest "${{ steps.rebase.outputs.manifest-path }}"

  # Real Electron E2E against the shipped entry point (`dist/main/index.cjs`
  # via `package.json#main`), independent of the packaged artifact -- this
  # is the pre-existing daily-loop/lifecycle/hostile-boundary evidence, kept
  # in this workflow so the required job set is complete in one place.
  desktop-e2e:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
      - name: Install locked JavaScript inputs
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Install Playwright browsers/Electron runtime dependencies
        run: pnpm --dir apps/desktop exec playwright install --with-deps
      - name: Run the real shipped-entry-point Electron E2E suite
        run: pnpm test:desktop:e2e

  # EXPERIMENT, NON-BLOCKING (this first run ONLY). It is genuinely unknown
  # whether a GitHub-hosted macos-15 runner can be granted Accessibility,
  # Screen Recording, or a write to the protected `com.apple.universalaccess`
  # domain. Rather than designing around a guess, this job PROBES what the
  # runner actually grants, prints it, and then runs the subset of macOS rows
  # that provably need no Accessibility grant -- so one real run settles the
  # question either way.
  #
  # RESOLVED 2026-09-04 (O-25). `continue-on-error` was written as temporary,
  # to be removed "after the first real run". THERE HAS BEEN NO FIRST RUN AND
  # THERE CANNOT BE ONE: this repository has no git remote, so no workflow in
  # this file has ever executed. Waiting for a run that cannot arrive would
  # have left a permanently non-blocking job forever -- exactly the vacuous
  # green this phase spent two plans removing.
  #
  # So it is resolved the other way: `continue-on-error` is GONE and the job is
  # in `desktop-promote`'s `needs`. If a remote is ever added, this job blocks
  # promotion the first time it runs, on evidence nobody has seen yet.
  #
  # THAT IS INTENTIONAL, and the first run may well fail. The open question it
  # was built to answer -- what a hosted macOS runner actually grants for
  # Accessibility, Screen Recording and Full Disk Access -- is still open. The
  # job probes TCC, PRINTS the report, and runs only the rows that provably
  # need no Accessibility grant (`--without-accessibility-trust`). If it fails
  # on that first run, read the printed probe report before changing anything:
  # the correct response is to narrow which ROWS run on a hosted runner, never
  # to restore `continue-on-error` and never to weaken a row so it passes.
  #
  # Until a remote exists, NOTHING in this file is evidence of anything. The
  # only authoritative gate on this project is the local
  # `node tooling/verify-desktop-phase.mjs`.
  #
  # Follows the same build-once/download-many discipline as every other test
  # job: it downloads the exact bytes `desktop-package` produced and NEVER
  # rebuilds.
  desktop-macos-integration:
    needs: [desktop-package]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
      - name: Install locked JavaScript inputs
        run: corepack enable && pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.KEEPLING_DESKTOP_ARTIFACT_ROOT }}
          path: ${{ runner.temp }}/${{ env.KEEPLING_DESKTOP_ARTIFACT_ROOT }}
      - name: Report what TCC this hosted runner actually grants
        run: |
          set -o pipefail
          swiftc -O -swift-version 5 -o "$RUNNER_TEMP/TccProbe" tooling/macos-integration/TccProbe.swift
          echo "--- hosted-runner TCC report (definitive for this runner image) ---"
          "$RUNNER_TEMP/TccProbe" | tee "$RUNNER_TEMP/tcc-report.json"
          echo "--- end TCC report ---"
      - name: Rebase the downloaded manifest onto this job's own artifact directory
        id: rebase
        run: |
          set -o pipefail
          artifact_root="$RUNNER_TEMP/${KEEPLING_DESKTOP_ARTIFACT_ROOT}"
          chmod -R u+x "$artifact_root"
          node -e "
            const fs = require('node:fs');
            const path = require('node:path');
            const root = process.argv[1];
            const manifestPath = path.join(root, 'package-manifest.json');
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            // T-06-02-01: see the identical comment in desktop-packaged --
            // only the archive travels; copiedApplicationPath/executablePath
            // are left as recorded and verify-macos-integration.mjs expands
            // archivePath itself.
            const archiveName = path.basename(manifest.archivePath);
            manifest.archivePath = path.join(root, archiveName);
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
            console.log(manifestPath);
          " "$artifact_root"
          echo "manifest-path=$artifact_root/package-manifest.json" >> "$GITHUB_OUTPUT"
      - name: Run the macOS rows that need no Accessibility grant, against the downloaded bytes
        run: |
          node tooling/verify-macos-integration.mjs \
            --without-accessibility-trust \
            --manifest "${{ steps.rebase.outputs.manifest-path }}"
      - name: Publish the TCC answer as an artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-runner-tcc-report
          path: ${{ runner.temp }}/tcc-report.json
          if-no-files-found: warn
          retention-days: 14

  # Promotion is the exclusive, single-writer step: it accepts ONLY the
  # digest `desktop-package` recorded, and ONLY after every required lane
  # above has passed. `package-desktop.mjs --promote` refuses a second
  # promotion attempt for the same digest and refuses a manifest missing any
  # required digest field.
  desktop-promote:
    needs: [desktop-units, desktop-package, desktop-packaged, desktop-e2e, desktop-macos-integration]
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.KEEPLING_DESKTOP_ARTIFACT_ROOT }}
          path: ${{ runner.temp }}/${{ env.KEEPLING_DESKTOP_ARTIFACT_ROOT }}
      - name: Promote only the recorded digest, exclusively, after every required lane passed
        run: |
          node tooling/package-desktop.mjs --promote "$RUNNER_TEMP/${KEEPLING_DESKTOP_ARTIFACT_ROOT}/package-manifest.json"
          echo "Promoted digest ${{ needs.desktop-package.outputs.application-digest }}"
