name: Desktop packaged evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  KEEPLING_DESKTOP_ARTIFACT_ROOT: keepling-desktop-package

jobs:
  desktop-units:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
      - name: Install locked JavaScript inputs
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Run contracts, pure/store/worker/ipc/performance vitest lanes, and both typechecks
        run: |
          set -o pipefail
          pnpm contracts:check
          pnpm test:desktop
          pnpm test:desktop:ipc
          pnpm typecheck:desktop
          pnpm typecheck:web

  # This IS the required "desktop-packaged" CI artifact lane the phase plan
  # calls for: package builds ONCE, uploads the exact bytes + immutable
  # manifest, and every downstream job downloads that SAME artifact into a
  # distinct directory rather than rebuilding. Promotion (below) accepts
  # only the digest this job recorded.
  desktop-package:
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      application-digest: ${{ steps.package.outputs.application-digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
      - name: Install locked JavaScript inputs
        run: corepack enable && pnpm install --frozen-lockfile
      # T-06-10-02: the Apple signing credentials are reachable ONLY from a
      # `push` event on this repository. A fork's changes arrive as
      # `pull_request`, which never takes this branch, so a fork can never
      # cause arbitrary bytes to be signed as Keepling. The step below is not
      # skipped on those runs -- it reports an explicit unsigned status, so a
      # fork build is visibly unsigned rather than silently indistinguishable
      # from a signed one.
      #
      # The identity is imported into an EPHEMERAL, run-scoped keychain and
      # `security find-identity` is scoped to that keychain, so nothing here
      # touches or enumerates any other identity on the machine.
      - name: Import the Developer ID identity into an ephemeral keychain
        id: signing
        env:
          APPLE_DEVELOPER_ID_CERT_P12: ${{ github.event_name == 'push' && secrets.APPLE_DEVELOPER_ID_CERT_P12 || '' }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ github.event_name == 'push' && secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_DEVELOPER_ID_CERT_P12}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "identity=" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unsigned build::No Developer ID certificate is reachable from this event (${{ github.event_name }}). This artifact is UNSIGNED and UNNOTARIZED, and the package manifest records it as such."
            exit 0
          fi
          keychain="$RUNNER_TEMP/keepling-signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_DEVELOPER_ID_CERT_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$keychain" -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/devid.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          fingerprint="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application:/ { print $2; exit }')"
          if [ -z "$fingerprint" ]; then
            echo "The imported certificate is not a usable Developer ID Application codesigning identity." >&2
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "identity=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Build once and record the immutable package manifest
        id: package
        env:
          # Empty on every run that cannot reach the secrets; forge.config.ts
          # then finds no identity and produces the same unsigned bundle it
          # produced before this task existed.
          KEEPLING_MACOS_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          KEEPLING_MACOS_NOTARIZE: ${{ steps.signing.outputs.available == 'true' && '1' || '0' }}
          APPLE_ID: ${{ github.event_name == 'push' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ github.event_name == 'push' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name == 'push' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -o pipefail
          pnpm package:desktop | tee "$RUNNER_TEMP/package.txt"
          manifest_path=$(grep -o '/.*/package-manifest.json' "$RUNNER_TEMP/package.txt" | tail -1)
          artifact_root=$(dirname "$manifest_path")
          echo "manifest-path=$manifest_path" >> "$GITHUB_OUTPUT"
          echo "artifact-root=$artifact_root" >> "$GITHUB_OUTPUT"
          digest=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')).applicationDigestSha256)" "$manifest_path")
          echo "application-digest=$digest" >> "$GITHUB_OUTPUT"
          archive_path=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')).archivePath)" "$manifest_path")
          # T-06-02-01: stage ONLY the manifest and the `ditto` transport
          # archive -- a single regular file -- rather than the raw `.app`
          # directory tree `actions/upload-artifact`'s own zip previously
          # lost mode bits and symlinks from. Every downstream job expands
          # this archive itself and re-verifies against
          # `applicationDigestSha256` (see `smoke-desktop-packaged.mjs` and
          # `verify-macos-integration.mjs`).
          mkdir -p "$RUNNER_TEMP/${KEEPLING_DESKTOP_ARTIFACT_ROOT}"
          cp "$manifest_path" "$RUNNER_TEMP/${KEEPLING_DESKTOP_ARTIFACT_ROOT}/"
          cp "$archive_path" "$RUNNER_TEMP/${KEEPLING_DESKTOP_ARTIFACT_ROOT}/"
          # D-17(b): the STAPLED archive travels too, and separately. It is
          # the shipped artifact; the archive above is the tested one. They
          # are different bytes on purpose -- stapling mutates the bundle --
          # and `--promote` gates the stapled one on the code directory hash,
          # the only identity that survives that mutation. On an unsigned run
          # there is no stapled artifact and this is a no-op.
          stapled_archive_path=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')).stapledArchivePath ?? '')" "$manifest_path")
          if [ -n "$stapled_archive_path" ]; then
            cp "$stapled_archive_path" "$RUNNER_TEMP/${KEEPLING_DESKTOP_ARTIFACT_ROOT}/"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.KEEPLING_DESKTOP_ARTIFACT_ROOT }}
          path: ${{ runner.temp }}/${{ env.KEEPLING_DESKTOP_ARTIFACT_ROOT }}
          if-no-files-found: error
          retention-days: 14

  # Test jobs NEVER rebuild and NEVER invoke `pnpm package:desktop` -- they
  # only download the exact bytes `desktop-package` produced and rewrite the
  # manifest's absolute paths to match this job's own download location
  # (the build job's paths are ephemeral to its own runner and never exist
  # on a different runner).
  desktop-packaged:
    needs: [desktop-package]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
      - name: Install locked JavaScript inputs
        run: corepack enable && pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.KEEPLING_DESKTOP_ARTIFACT_ROOT }}
          path: ${{ runner.temp }}/${{ env.KEEPLING_DESKTOP_ARTIFACT_ROOT }}
      - name: Rebase the downloaded manifest onto this job's own artifact directory
        id: rebase
        run: |
          set -o pipefail
          artifact_root="$RUNNER_TEMP/${KEEPLING_DESKTOP_ARTIFACT_ROOT}"
          chmod -R u+x "$artifact_root"
          node -e "
            const fs = require('node:fs');
            const path = require('node:path');
            const root = process.argv[1];
            const manifestPath = path.join(root, 'package-manifest.json');
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            // T-06-02-01: only the transport archive -- a single regular
            // file -- was actually staged and downloaded onto this runner.
            // The raw .app directory this manifest's copiedApplicationPath
            // names was the BUILD job's ephemeral tree and does not exist
            // here; the consuming scripts (smoke-desktop-packaged.mjs,
            // verify-macos-integration.mjs) expand archivePath themselves
            // and re-verify against applicationDigestSha256, so
            // copiedApplicationPath/executablePath are left as recorded.
            const archiveName = path.basename(manifest.archivePath);
            manifest.archivePath = path.join(root, archiveName);
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
            console.log(manifestPath);
          " "$artifact_root" | tee "$RUNNER_TEMP/rebase.txt"
          echo "manifest-path=$artifact_root/package-manifest.json" >> "$GITHUB_OUTPUT"
      - name: Run every packaged Playwright spec against the exact downloaded bytes
        run: node tooling/smoke-desktop-packaged.mjs --manifest "${{ steps.rebase.outputs.manifest-path }}"

  # Real Electron E2E against the shipped entry point (`dist/main/index.cjs`
  # via `package.json#main`), independent of the packaged artifact -- this
  # is the pre-existing daily-loop/lifecycle/hostile-boundary evidence, kept
  # in this workflow so the required job set is complete in one place.
  desktop-e2e:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
      - name: Install locked JavaScript inputs
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Install Playwright browsers/Electron runtime dependencies
        run: pnpm --dir apps/desktop exec playwright install --with-deps
      - name: Run the real shipped-entry-point Electron E2E suite
        run: pnpm test:desktop:e2e

  # EXPERIMENT, NON-BLOCKING (this first run ONLY). It is genuinely unknown
  # whether a GitHub-hosted macos-15 runner can be granted Accessibility,
  # Screen Recording, or a write to the protected `com.apple.universalaccess`
  # domain. Rather than designing around a guess, this job PROBES what the
  # runner actually grants, prints it, and then runs the subset of macOS rows
  # that provably need no Accessibility grant -- so one real run settles the
  # question either way.
  #
  # RESOLVED 2026-09-04 (O-25). `continue-on-error` was written as temporary,
  # to be removed "after the first real run". THERE HAS BEEN NO FIRST RUN AND
  # THERE CANNOT BE ONE: this repository has no git remote, so no workflow in
  # this file has ever executed. Waiting for a run that cannot arrive would
  # have left a permanently non-blocking job forever -- exactly the vacuous
  # green this phase spent two plans removing.
  #
  # So it is resolved the other way: `continue-on-error` is GONE and the job is
  # in `desktop-promote`'s `needs`. If a remote is ever added, this job blocks
  # promotion the first time it runs, on evidence nobody has seen yet.
  #
  # THAT IS INTENTIONAL, and the first run may well fail. The open question it
  # was built to answer -- what a hosted macOS runner actually grants for
  # Accessibility, Screen Recording and Full Disk Access -- is still open. The
  # job probes TCC, PRINTS the report, and runs only the rows that provably
  # need no Accessibility grant (`--without-accessibility-trust`). If it fails
  # on that first run, read the printed probe report before changing anything:
  # the correct response is to narrow which ROWS run on a hosted runner, never
  # to restore `continue-on-error` and never to weaken a row so it passes.
  #
  # Until a remote exists, NOTHING in this file is evidence of anything. The
  # only authoritative gate on this project is the local
  # `node tooling/verify-desktop-phase.mjs`.
  #
  # Follows the same build-once/download-many discipline as every other test
  # job: it downloads the exact bytes `desktop-package` produced and NEVER
  # rebuilds.
  desktop-macos-integration:
    needs: [desktop-package]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
      - name: Install locked JavaScript inputs
        run: corepack enable && pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.KEEPLING_DESKTOP_ARTIFACT_ROOT }}
          path: ${{ runner.temp }}/${{ env.KEEPLING_DESKTOP_ARTIFACT_ROOT }}
      - name: Report what TCC this hosted runner actually grants
        run: |
          set -o pipefail
          swiftc -O -swift-version 5 -o "$RUNNER_TEMP/TccProbe" tooling/macos-integration/TccProbe.swift
          echo "--- hosted-runner TCC report (definitive for this runner image) ---"
          "$RUNNER_TEMP/TccProbe" | tee "$RUNNER_TEMP/tcc-report.json"
          echo "--- end TCC report ---"
      - name: Rebase the downloaded manifest onto this job's own artifact directory
        id: rebase
        run: |
          set -o pipefail
          artifact_root="$RUNNER_TEMP/${KEEPLING_DESKTOP_ARTIFACT_ROOT}"
          chmod -R u+x "$artifact_root"
          node -e "
            const fs = require('node:fs');
            const path = require('node:path');
            const root = process.argv[1];
            const manifestPath = path.join(root, 'package-manifest.json');
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            // T-06-02-01: see the identical comment in desktop-packaged --
            // only the archive travels; copiedApplicationPath/executablePath
            // are left as recorded and verify-macos-integration.mjs expands
            // archivePath itself.
            const archiveName = path.basename(manifest.archivePath);
            manifest.archivePath = path.join(root, archiveName);
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
            console.log(manifestPath);
          " "$artifact_root"
          echo "manifest-path=$artifact_root/package-manifest.json" >> "$GITHUB_OUTPUT"
      # `--without-accessibility-trust` now also subtracts the live-appearance
      # row (A14). That row needs a logged-in Aqua session to deliver
      # `AppleInterfaceThemeChangedNotification` to an already-running app, which
      # a hosted runner does not have -- see the `requiresLiveAppearanceSession`
      # comment in `tooling/verify-macos-integration.mjs`. It is NOT dropped: it
      # is the `macos-integration-live-appearance` lane in
      # `tooling/release-lanes.json`, `authority: "local-attested"` with a stated
      # physical blocker, and it emits an explicit BLOCKED zero-case entry into
      # every release manifest.
      - name: Run the macOS rows a hosted runner can physically drive, against the downloaded bytes
        run: |
          node tooling/verify-macos-integration.mjs \
            --without-accessibility-trust \
            --manifest "${{ steps.rebase.outputs.manifest-path }}"
      - name: Publish the TCC answer as an artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-runner-tcc-report
          path: ${{ runner.temp }}/tcc-report.json
          if-no-files-found: warn
          retention-days: 14

  # SRV-02's completion lane, and the only unchecked requirement box in this
  # phase that is actually closable. Its own disclosure names the closing
  # command: "wire `node tooling/verify-cross-adapter-phase.mjs` into a
  # committed workflow job ... then restore this box when the lane PASSES in
  # the release manifest." The lane has existed and passed locally since
  # 06-05, across all four legs, byte-identically. It reported BLOCKED for one
  # reason only: no committed job invoked it (window 83).
  #
  # IT LIVES HERE, NOT IN repository-integrity.yml, BECAUSE OF WHERE ITS BYTES
  # COME FROM. The electron leg drives a PACKAGED application, and this
  # workflow's own rule is absolute: "Test jobs NEVER rebuild and NEVER invoke
  # `pnpm package:desktop` -- they only download the exact bytes
  # `desktop-package` produced." A cross-adapter job that packaged its own
  # Electron build would be binding a cross-client proof to locally built
  # bytes, which is the exact loophole this repository forbids. So it `needs`
  # desktop-package, downloads that artifact, re-verifies
  # archiveDigestSha256 before expanding, and drives what came down the wire.
  #
  # The iOS leg needs no credential at all. apps/ios/Signing.xcconfig states
  # it in its own words: "Simulator builds and the whole simulator test suite
  # need no team, so a fresh clone builds and tests green with no signing
  # setup at all." Only physical-device builds need the local team file, and
  # this lane does not use one.
  cross-adapter-phase:
    needs: [desktop-package]
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
      - name: Install locked JavaScript inputs
        run: corepack enable && pnpm install --frozen-lockfile
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.asdf/installs
            apps/server/deps
            apps/server/_build
          key: cross-adapter-${{ runner.os }}-${{ hashFiles('tooling/runtime-versions.env', 'apps/server/mix.lock') }}
      - name: Provision the exact pinned Elixir and PostgreSQL runtimes
        run: |
          set -eu
          brew list asdf >/dev/null 2>&1 || brew install asdf
          ./tooling/runtime-preflight.sh --provision
          ./tooling/runtime-preflight.sh --exec -- sh -c 'cd apps/server && mix deps.get --check-locked'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.KEEPLING_DESKTOP_ARTIFACT_ROOT }}
          path: ${{ runner.temp }}/${{ env.KEEPLING_DESKTOP_ARTIFACT_ROOT }}
      # Expand the DOWNLOADED archive into the layout
      # tooling/cross-adapter/electron-driver.mjs resolves
      # (`apps/desktop/out/<platform>/*.app/Contents/MacOS/<name>`), after
      # re-verifying the digest the build job recorded. The digest check is
      # the whole point: without it this step would be trusting a transport
      # artifact, and the electron leg would be proving something about bytes
      # nobody vouched for. `ditto -x -k` is the matching expansion for the
      # `ditto -c -k --keepParent` archive package-desktop.mjs writes, and it
      # is what tooling/smoke-desktop-packaged.mjs already uses.
      - name: Expand the exact downloaded package into the driver's layout
        run: |
          set -eu
          artifact_root="$RUNNER_TEMP/${KEEPLING_DESKTOP_ARTIFACT_ROOT}"
          chmod -R u+x "$artifact_root"
          node -e "
            const { createHash } = require('node:crypto');
            const fs = require('node:fs');
            const path = require('node:path');
            const root = process.argv[1];
            const manifest = JSON.parse(fs.readFileSync(path.join(root, 'package-manifest.json'), 'utf8'));
            const archive = path.join(root, path.basename(manifest.archivePath));
            const actual = createHash('sha256').update(fs.readFileSync(archive)).digest('hex');
            if (actual !== manifest.archiveDigestSha256) {
              console.error('downloaded archive digest ' + actual + ' does not match the recorded ' + manifest.archiveDigestSha256);
              process.exit(1);
            }
            const outDir = 'apps/desktop/out/Keepling-' + manifest.platform + '-' + manifest.architecture;
            fs.appendFileSync(process.env.GITHUB_ENV, 'KEEPLING_CROSS_ADAPTER_ARCHIVE=' + archive + '\\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'KEEPLING_CROSS_ADAPTER_OUT_DIR=' + outDir + '\\n');
            console.log('archive digest verified against the build job record; expanding into ' + outDir);
          " "$artifact_root"
      - name: Place the verified bytes where the electron driver resolves them
        run: |
          set -eu
          mkdir -p "$KEEPLING_CROSS_ADAPTER_OUT_DIR"
          ditto -x -k "$KEEPLING_CROSS_ADAPTER_ARCHIVE" "$KEEPLING_CROSS_ADAPTER_OUT_DIR"
          test -d "$KEEPLING_CROSS_ADAPTER_OUT_DIR"/*.app
          ls -la "$KEEPLING_CROSS_ADAPTER_OUT_DIR"
      # tooling/cross-adapter/legs.mjs refuses the iPhone leg unless a booted
      # simulator already carries the app -- it does not build or install it,
      # by design. The driver then does its OWN `build-for-testing` against
      # the same destination, so this step exists purely to satisfy that
      # precondition with a real installed application rather than a stub.
      - name: Boot a simulator and install the app the iPhone leg requires
        run: |
          set -eu
          device=$(xcrun simctl list devices available --json |
            node -e "
              let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>{
                const runtimes = JSON.parse(d).devices;
                const names = Object.keys(runtimes).filter(k => k.includes('iOS')).sort().reverse();
                for (const runtime of names) {
                  const match = runtimes[runtime].find(x => x.isAvailable && /^iPhone /.test(x.name));
                  if (match) { console.log(match.udid + '\t' + match.name); return; }
                }
                console.error('no available iPhone simulator on this runner'); process.exit(1);
              });")
          udid=${device%%	*}
          name=${device##*	}
          echo "booting $name ($udid)"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcodebuild build \
            -project apps/ios/Keepling.xcodeproj \
            -scheme Keepling \
            -destination "platform=iOS Simulator,id=$udid" \
            -destination-timeout 300 \
            -derivedDataPath .artifacts/ios/DerivedData-cross-adapter-ci \
            CODE_SIGNING_ALLOWED=NO >/dev/null
          app=$(find .artifacts/ios/DerivedData-cross-adapter-ci/Build/Products -maxdepth 2 -name 'Keepling.app' -print -quit)
          test -n "$app" || { echo 'no simulator Keepling.app was produced'; exit 1; }
          xcrun simctl install "$udid" "$app"
          xcrun simctl listapps "$udid" | grep -qi keepling
          echo "KEEPLING_CROSS_ADAPTER_IOS_DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"
      - name: Run all four adapter legs against one real server revision
        run: |
          set -o pipefail
          node tooling/verify-cross-adapter-phase.mjs | tee "$RUNNER_TEMP/cross-adapter-phase.txt"
          ./tooling/verify-privacy.sh "$RUNNER_TEMP/cross-adapter-phase.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cross-adapter-phase-evidence
          path: ${{ runner.temp }}/cross-adapter-phase.txt
          if-no-files-found: error
          retention-days: 90

  # Promotion is the exclusive, single-writer step: it accepts ONLY the
  # digest `desktop-package` recorded, and ONLY after every required lane
  # above has passed. `package-desktop.mjs --promote` refuses a second
  # promotion attempt for the same digest and refuses a manifest missing any
  # required digest field.
  desktop-promote:
    needs: [desktop-units, desktop-package, desktop-packaged, desktop-e2e, desktop-macos-integration, cross-adapter-phase]
    runs-on: macos-15
    timeout-minutes: 20
    # D-22/T-06-10-03: id-token/attestations are granted at JOB level only,
    # never at the top-level workflow permissions block -- a workflow-wide
    # grant would hand the OIDC token to every pull-request-triggered job in
    # this file, not only the one that actually attests a release.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.KEEPLING_DESKTOP_ARTIFACT_ROOT }}
          path: ${{ runner.temp }}/${{ env.KEEPLING_DESKTOP_ARTIFACT_ROOT }}
      # The stapled artifact's own path was ephemeral to the BUILD runner and
      # does not exist here; only the stapled archive travelled. Point the
      # manifest at this job's copy so the code directory hash gate has real
      # bytes to inspect. The gate is fail-closed: a manifest claiming a
      # Developer ID signature with no reachable stapled artifact is refused,
      # so this rebase can never quietly turn the gate into a no-op.
      - name: Rebase the stapled artifact path onto this job's download
        run: |
          set -o pipefail
          artifact_root="$RUNNER_TEMP/${KEEPLING_DESKTOP_ARTIFACT_ROOT}"
          chmod -R u+x "$artifact_root"
          node -e "
            const fs = require('node:fs');
            const path = require('node:path');
            const root = process.argv[1];
            const manifestPath = path.join(root, 'package-manifest.json');
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            manifest.archivePath = path.join(root, path.basename(manifest.archivePath));
            if (manifest.stapledArchivePath) {
              manifest.stapledArchivePath = path.join(root, path.basename(manifest.stapledArchivePath));
            }
            // The .app tree itself never travels -- say so, rather than
            // leaving a path that resolves to nothing on this runner.
            manifest.stapledApplicationPath = null;
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          " "$artifact_root"
      - name: Promote only the recorded digest, exclusively, after every required lane passed
        run: |
          node tooling/package-desktop.mjs --promote "$RUNNER_TEMP/${KEEPLING_DESKTOP_ARTIFACT_ROOT}/package-manifest.json"
          echo "Promoted digest ${{ needs.desktop-package.outputs.application-digest }}"
      # D-22: SLSA Build Level 2 provenance, naming the exact packaged
      # archive as its subject. This project claims exactly Level 2 and
      # never Level 3 -- Level 3 needs a reusable workflow with isolated
      # signing, which this single-job build+attest pipeline does not have.
      - name: Attest build provenance for the packaged archive (SLSA Build Level 2)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/${{ env.KEEPLING_DESKTOP_ARTIFACT_ROOT }}/*.ditto.zip
      # D-20 (06-10 Task 4): both CycloneDX documents are generated FROM
      # SOURCE at this revision, never by scanning the built .app -- see
      # tooling/generate-sbom.mjs's own header for why a binary scan would
      # be near-empty and misleading. Provisioning the Elixir/OTP toolchain
      # here (this job otherwise never needs it) is the cost of generating
      # the Hex half from source rather than skipping it.
      - name: Provision the Elixir/OTP toolchain for source-based SBOM generation
        run: |
          brew list asdf >/dev/null 2>&1 || brew install asdf
          ./tooling/runtime-preflight.sh --provision
          corepack enable
          pnpm install --frozen-lockfile
          # Installing Elixir is not enough. A fresh OTP install has no Hex,
          # and `mix sbom.cyclonedx` needs it twice over: to resolve the
          # project's own dependencies, and because the `:sbom` task is itself
          # a Hex package. Without this the task dies on an interactive prompt
          # no CI run can answer:
          #   Mix requires the Hex package manager to fetch dependencies
          #   ** (Mix) Could not find an SCM for dependency :phoenix
          #   Shall I install Hex? (if running non-interactively, use ...)
          #
          # These go through `--exec`, like every other mix invocation in this
          # repository's workflows. `--provision` exports the asdf toolchain
          # PATH inside its OWN process and writes nothing to $GITHUB_PATH, so
          # a bare `mix` in this step resolves against the runner's PATH and
          # fails with `mix: command not found` (exit 127) even though the
          # preflight just reported Elixir 1.20.2. `--exec` re-runs the same
          # resolution and then execs the command inside it.
          #
          # `deps.get` matters because "from source" still means from a
          # RESOLVED tree: mix.lock names the versions, deps.get is what makes
          # them inspectable.
          ./tooling/runtime-preflight.sh --exec -- sh -c 'mix local.hex --force && mix local.rebar --force && cd apps/server && mix deps.get'
      - name: Generate the Hex and npm bills of materials from source
        # Also via `--exec`: generate-sbom.mjs shells out to `mix
        # sbom.cyclonedx`, so it needs the same toolchain PATH the mix steps do
        # rather than whatever the runner happens to expose.
        run: ./tooling/runtime-preflight.sh --exec -- node tooling/generate-sbom.mjs --out "$RUNNER_TEMP/${KEEPLING_DESKTOP_ARTIFACT_ROOT}/sbom"
      # D-21: SHA-256 checksums for the archive and the stapled application,
      # worded as a TEMPLATE for the GitHub Release body -- this repository
      # has no git remote and has never cut a GitHub Release, so no
      # `gh release create` step exists to consume it yet (adding that
      # publish pipeline is a separate, undecided piece of infrastructure,
      # not this task's declared scope). A checksum served from the same
      # origin as the artifact is worthless; GitHub Releases is a different
      # trust domain from the self-hosted server, which is the only thing
      # that gives a checksum here any value.
      - name: Generate the release body checksum template
        run: |
          manifest="$RUNNER_TEMP/${KEEPLING_DESKTOP_ARTIFACT_ROOT}/package-manifest.json"
          out="$RUNNER_TEMP/${KEEPLING_DESKTOP_ARTIFACT_ROOT}/RELEASE-BODY.md"
          node -e "
            const fs = require('node:fs');
            const m = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const lines = [
              '## Checksums',
              '',
              '| Artifact | SHA-256 |',
              '|---|---|',
              \`| Archive (\${require('node:path').basename(m.archivePath)}) | \\\`\${m.archiveDigestSha256}\\\` |\`,
              m.codeDirectoryHash
                ? \`| Stapled application (code directory hash) | \\\`\${m.codeDirectoryHash}\\\` |\`
                : \`| Application digest (pre-signing; signing not yet wired) | \\\`\${m.applicationDigestSha256}\\\` |\`,
              '',
              'The load-bearing controls for this release are the packaging',
              'reproducibility lane and the SLSA Build Level 2 provenance',
              'attestation above, not these checksums -- almost nobody will',
              'manually verify a hash. See docs/security/SUPPLY-CHAIN.md for',
              'the full, separated signing/provenance/SBOM posture.',
            ];
            fs.writeFileSync(process.argv[2], lines.join('\n') + '\n');
          " "$manifest" "$out"
          cat "$out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: keepling-release-evidence
          path: |
            ${{ runner.temp }}/${{ env.KEEPLING_DESKTOP_ARTIFACT_ROOT }}/sbom
            ${{ runner.temp }}/${{ env.KEEPLING_DESKTOP_ARTIFACT_ROOT }}/RELEASE-BODY.md
          if-no-files-found: error
          retention-days: 14
