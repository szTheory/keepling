components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: _keepling_key
      description: >-
        Ambient browser session cookie. Requests authenticated this way are
        additionally required to carry a same-origin Origin header and a CSRF
        token; a bearer client is not, because CSRF rides ambient credentials
        a browser attaches automatically and a bearer client has none.
    DeviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Opaque short-lived native installation access credential.
  parameters:
    SyncCursorParameter:
      in: query
      name: cursor
      required: false
      schema:
        $ref: '#/components/schemas/SyncCursor'
    SyncPullLimitParameter:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 200
    SyncBootstrapLimitParameter:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    TaskViewCursorParameter:
      in: query
      name: cursor
      required: false
      schema:
        $ref: '#/components/schemas/TaskViewCursor'
    TaskViewLimitParameter:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
  responses:
    ProblemResponse:
      description: Closed RFC 9457 problem
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    DurableCommandType:
      description: >-
        Optional self-description carried inside a command by an OFFLINE
        client. Such a client commits the serialized bytes to a durable
        outbox before reporting success and retries those exact bytes, never
        re-serialized, so after a relaunch the bytes are all that survives
        and must say which command they are. An online client posts to a
        typed endpoint and forgets, so it neither sends nor needs this.

        The server NEVER routes on this value. Routing comes from the URL
        alone; the server checks that the client's own description agrees
        with the endpoint and refuses the request when it does not.
      type: string
      enum:
        - archive_organization
        - assign_task_organizations
        - capture_task
        - clarify_task
        - complete_task
        - create_organization
        - edit_task
        - edit_task_dates
        - move_today_task
        - plan_for_today
        - rename_organization
        - reopen_task
        - resolve_task_conflict
        - restore_task
        - return_to_inbox
        - trash_task
        - unarchive_organization
        - undo_task
        - unplan_task
    MutationTrustState:
      type: string
      enum: [local_saved, checking, accepted, rejected, conflict, authentication_required, quarantined]
    SynchronizationTrustState:
      type: string
      enum: [starting, catching_up, ready, stale_last_good, retryable_failure]
    CompatibilityTrustState:
      type: string
      enum: [supported, deprecated_but_safe, unsupported]
    RecoveryTrustState:
      type: string
      enum: [backup_unverified, restore_in_progress, restore_verified, restore_failed]
    TrustStateFact:
      type: object
      additionalProperties: false
      required: [consequence, durable_location, next_action, state]
      properties:
        consequence: {type: string, minLength: 1}
        durable_location: {type: string, minLength: 1}
        next_action: {type: string, minLength: 1}
        state:
          oneOf:
            - $ref: '#/components/schemas/MutationTrustState'
            - $ref: '#/components/schemas/SynchronizationTrustState'
            - $ref: '#/components/schemas/CompatibilityTrustState'
            - $ref: '#/components/schemas/RecoveryTrustState'
    SyncCursor:
      type: string
      minLength: 1
      maxLength: 4096
      description: Opaque authenticated feed or bootstrap position bound to the server-derived installation namespace.
    SyncPosition:
      type: object
      additionalProperties: false
      required:
        - ordinal
        - sequence
      properties:
        ordinal:
          type: integer
          minimum: -1
        sequence:
          type: integer
          format: int64
          minimum: 0
    SyncFeedPage:
      type: object
      additionalProperties: false
      required:
        - changes
        - coverage_cursor
        - has_more
      properties:
        changes:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/SyncFeedEnvelope'
        coverage_cursor:
          anyOf:
            - $ref: '#/components/schemas/SyncCursor'
            - type: 'null'
        has_more:
          type: boolean
    SyncFeedEnvelope:
      type: object
      additionalProperties: false
      required:
        - entity_id
        - entity_revision
        - entity_type
        - inserted_at
        - kind
        - mutation_id
        - ordinal
        - payload
        - sequence
      properties:
        entity_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        entity_revision:
          anyOf:
            - $ref: '#/components/schemas/Revision'
            - type: 'null'
        entity_type:
          anyOf:
            - type: string
              enum: [command, task, organization, conflict, collection_membership, undo]
            - type: 'null'
        inserted_at:
          type: string
          format: date-time
        kind:
          type: string
          enum: [command_outcome, task_snapshot, organization_snapshot, conflict_snapshot, collection_tombstone, undo_metadata]
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        ordinal:
          type: integer
          minimum: 0
        payload:
          oneOf:
            - $ref: '#/components/schemas/SyncCommandOutcomePayload'
            - $ref: '#/components/schemas/SyncTaskSnapshot'
            - $ref: '#/components/schemas/SyncOrganizationSnapshot'
            - $ref: '#/components/schemas/PersistedConflict'
            - $ref: '#/components/schemas/SyncCollectionTombstone'
            - $ref: '#/components/schemas/SyncUndoMetadata'
        sequence:
          type: integer
          format: int64
          minimum: 1
    SyncCommandOutcomePayload:
      type: object
      additionalProperties: false
      required: [result, status]
      properties:
        result:
          $ref: '#/components/schemas/MutationResult'
        status:
          type: integer
          minimum: 200
          maximum: 599
    SyncTaskSnapshot:
      type: object
      additionalProperties: false
      required: [captured_at, completed_at, deadline_on, id, inbox_state, notes, planned_on, project_id, revision, tag_ids, title, trashed_at]
      properties:
        captured_at: {type: string, format: date-time}
        completed_at:
          anyOf: [{type: string, format: date-time}, {type: 'null'}]
        deadline_on:
          $ref: '#/components/schemas/NullableCivilDate'
        id:
          $ref: '#/components/schemas/TaskIdentity'
        inbox_state: {type: string, enum: [inbox, clarified]}
        notes: {type: string}
        planned_on:
          $ref: '#/components/schemas/NullableCivilDate'
        project_id:
          anyOf: [{$ref: '#/components/schemas/OrganizationIdentity'}, {type: 'null'}]
        revision:
          $ref: '#/components/schemas/Revision'
        tag_ids:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/OrganizationIdentity'}
        title: {type: string}
        trashed_at:
          anyOf: [{type: string, format: date-time}, {type: 'null'}]
    SyncOrganizationSnapshot:
      type: object
      additionalProperties: false
      required: [archived_at, id, kind, name, revision]
      properties:
        archived_at:
          anyOf: [{type: string, format: date-time}, {type: 'null'}]
        id: {$ref: '#/components/schemas/OrganizationIdentity'}
        kind: {$ref: '#/components/schemas/OrganizationKind'}
        name: {$ref: '#/components/schemas/OrganizationName'}
        revision: {$ref: '#/components/schemas/Revision'}
    SyncCollectionTombstone:
      type: object
      additionalProperties: false
      required: [collection, organization_id, task_id]
      properties:
        collection: {type: string, enum: [task_project, task_tags]}
        organization_id: {$ref: '#/components/schemas/OrganizationIdentity'}
        task_id: {$ref: '#/components/schemas/TaskIdentity'}
    SyncUndoMetadata:
      type: object
      additionalProperties: false
      required: [expires_at, label]
      properties:
        expires_at: {type: string, format: date-time}
        label: {type: string, minLength: 1, maxLength: 200}
    SyncBootstrapPage:
      type: object
      additionalProperties: false
      required: [entities, high_water, next_cursor]
      properties:
        entities:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/SyncBootstrapEntity'}
        high_water: {$ref: '#/components/schemas/SyncPosition'}
        next_cursor:
          anyOf: [{$ref: '#/components/schemas/SyncCursor'}, {type: 'null'}]
    SyncBootstrapEntity:
      type: object
      additionalProperties: false
      required: [entity_id, entity_type, kind, snapshot]
      properties:
        entity_id: {type: string, format: uuid}
        entity_type: {type: string, enum: [organization, task]}
        kind: {type: string, enum: [organization_snapshot, task_snapshot]}
        snapshot:
          oneOf:
            - $ref: '#/components/schemas/SyncOrganizationSnapshot'
            - $ref: '#/components/schemas/SyncTaskSnapshot'
    CompatibilityResponse:
      type: object
      additionalProperties: false
      required:
        - compatibility_state
        - deprecation_deadline
        - pending_intent
        - platform_minimum_builds
        - protocol_policy
        - recovery_code
        - recovery_codes
        - retryable
        - schema_range
        - selected_protocol_train
        - server_release
        - supported_protocols
        - tested_oci_digest
        - update_location
      properties:
        compatibility_state:
          $ref: '#/components/schemas/CompatibilityTrustState'
        deprecation_deadline:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        pending_intent:
          type: string
          const: preserved_locally
        platform_minimum_builds:
          $ref: '#/components/schemas/PlatformMinimumBuilds'
        protocol_policy:
          type: string
          enum:
            - unstable_current_dogfood
            - current_and_previous_90_days
        recovery_code:
          $ref: '#/components/schemas/CompatibilityRecoveryCode'
        recovery_codes:
          type: array
          minItems: 4
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CompatibilityRecoveryCode'
        retryable:
          type: boolean
          const: false
        schema_range:
          $ref: '#/components/schemas/CompatibilityRange'
        selected_protocol_train:
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
        server_release:
          type: string
          minLength: 1
        supported_protocols:
          $ref: '#/components/schemas/SupportedProtocols'
        tested_oci_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        update_location:
          type: string
          format: uri
    CompatibilityRange:
      type: object
      additionalProperties: false
      required:
        - maximum
        - minimum
      properties:
        maximum:
          type: integer
          minimum: 1
        minimum:
          type: integer
          minimum: 1
    CompatibilityRecoveryCode:
      type: string
      enum:
        - continue
        - client_update_available
        - client_upgrade_required
        - server_upgrade_required
    PlatformMinimumBuilds:
      type: object
      additionalProperties: false
      required:
        - electron
        - iphone
      properties:
        electron:
          type: integer
          minimum: 0
        iphone:
          type: integer
          minimum: 0
    SupportedProtocols:
      type: object
      additionalProperties: false
      required:
        - read
        - sync
        - write
      properties:
        read:
          $ref: '#/components/schemas/CompatibilityRange'
        sync:
          $ref: '#/components/schemas/CompatibilityRange'
        write:
          $ref: '#/components/schemas/CompatibilityRange'
    DeviceGrantIdentity:
      type: string
      format: uuid
    DeviceGrantRevocationResponse:
      type: object
      additionalProperties: false
      required:
        - installation_id
        - status
      properties:
        installation_id:
          $ref: '#/components/schemas/InstallationIdentity'
        status:
          type: string
          const: device_grant_revoked
    DeviceGrantSummary:
      type: object
      additionalProperties: false
      required:
        - client_kind
        - generation
        - id
        - installation_id
        - label
        - revoked
      properties:
        client_kind:
          $ref: '#/components/schemas/NativeClientIdentity'
        generation:
          type: integer
          format: int64
          minimum: 1
        id:
          $ref: '#/components/schemas/DeviceGrantIdentity'
        installation_id:
          $ref: '#/components/schemas/InstallationIdentity'
        label:
          type: string
          minLength: 1
          maxLength: 200
        revoked:
          type: boolean
    DeviceGrantsResponse:
      type: object
      additionalProperties: false
      required:
        - device_grants
      properties:
        device_grants:
          type: array
          items:
            $ref: '#/components/schemas/DeviceGrantSummary'
    InstallationIdentity:
      type: string
      minLength: 1
      maxLength: 200
    NativeAuthorizationCode:
      type: string
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]+$'
    NativeAuthorizationCodeExchangeRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - code_verifier
        - grant_type
        - redirect_uri
        - state
      properties:
        code:
          $ref: '#/components/schemas/NativeAuthorizationCode'
        code_verifier:
          $ref: '#/components/schemas/PkceVerifier'
        grant_type:
          type: string
          const: authorization_code
        redirect_uri:
          type: string
          format: uri
        state:
          $ref: '#/components/schemas/NativeAuthorizationState'
    NativeAuthorizationState:
      type: string
      minLength: 43
      maxLength: 512
      pattern: '^[A-Za-z0-9_-]+$'
    NativeClientIdentity:
      type: string
      enum:
        - electron
        - iphone
    NativeRefreshRequest:
      type: object
      additionalProperties: false
      required:
        - grant_type
        - refresh_token
      properties:
