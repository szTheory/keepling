openapi: 3.1.0
info:
  title: Keepling API
  version: 0.1.0
  description: >-
    Versioned same-origin transport for Keepling semantic commands. Domain,
    persistence, generated wire, and browser view representations remain separate.
servers:
  - url: /api/v1
    description: Same-origin Keepling API
paths:
  /compatibility:
    get:
      operationId: getCompatibility
      summary: Negotiate the highest safe protocol train against authoritative server metadata
      servers:
        - url: /
      parameters:
        - in: query
          name: minimum_protocol_train
          required: true
          schema:
            type: integer
            minimum: 0
        - in: query
          name: maximum_protocol_train
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Authoritative release, protocol, schema, platform, and recovery metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
  /oauth/authorize:
    get:
      operationId: authorizeNativeInstallation
      summary: Authorize one native public-client installation through the browser session
      servers:
        - url: /
      parameters:
        - in: query
          name: response_type
          required: true
          schema:
            type: string
            const: code
        - in: query
          name: client_id
          required: true
          schema:
            $ref: '#/components/schemas/NativeClientIdentity'
        - in: query
          name: installation_id
          required: true
          schema:
            $ref: '#/components/schemas/InstallationIdentity'
        - in: query
          name: label
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - in: query
          name: redirect_uri
          required: true
          schema:
            type: string
            format: uri
        - in: query
          name: state
          required: true
          schema:
            $ref: '#/components/schemas/NativeAuthorizationState'
        - in: query
          name: code_challenge
          required: true
          schema:
            $ref: '#/components/schemas/PkceChallenge'
        - in: query
          name: code_challenge_method
          required: true
          schema:
            type: string
            const: S256
      responses:
        '302':
          description: Exact registered redirect with one-use authorization code and preserved state
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /oauth/token:
    post:
      operationId: exchangeNativeAuthorizationCode
      summary: Exchange an exact redirect, state, and S256 verifier for opaque grant credentials
      servers:
        - url: /
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeAuthorizationCodeExchangeRequest'
      responses:
        '200':
          description: Opaque short-lived access and rotating refresh credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeTokenResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /oauth/token/refresh:
    post:
      operationId: refreshNativeGrant
      summary: Rotate one native installation refresh credential
      servers:
        - url: /
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeRefreshRequest'
      responses:
        '200':
          description: Rotated opaque access and refresh credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeTokenResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /device-grants:
    get:
      operationId: listDeviceGrants
      summary: List separately visible native installation grants
      security:
        - DeviceBearer: []
      responses:
        '200':
          description: Installation grant inventory without credential material
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceGrantsResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /device-grants/{installation_id}:
    parameters:
      - in: path
        name: installation_id
        required: true
        schema:
          $ref: '#/components/schemas/InstallationIdentity'
    delete:
      operationId: revokeDeviceGrant
      summary: Idempotently revoke one exact installation grant family
      security:
        - DeviceBearer: []
      responses:
        '200':
          description: Installation grant is revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceGrantRevocationResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /sync:
    get:
      operationId: pullSyncPage
      summary: Pull one bounded account-scoped synchronization page
      security:
        - DeviceBearer: []
      parameters:
        - $ref: '#/components/parameters/SyncCursorParameter'
        - $ref: '#/components/parameters/SyncPullLimitParameter'
      responses:
        '200':
          description: Ordered changes and exact feed coverage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncFeedPage'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /sync/bootstrap:
    get:
      operationId: bootstrapSync
      summary: Read one bounded page of canonical synchronization state
      security:
        - DeviceBearer: []
      parameters:
        - $ref: '#/components/parameters/SyncCursorParameter'
        - $ref: '#/components/parameters/SyncBootstrapLimitParameter'
      responses:
        '200':
          description: Canonical bootstrap entities bound to one high-water position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncBootstrapPage'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /setup:
    post:
      operationId: completeSetup
      summary: Consume the operator-issued capability and create the sole account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '201':
          description: Sole account created and setup permanently disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /login:
    post:
      operationId: login
      summary: Authenticate the closed personal account and rotate browser session state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Browser session established with fresh CSRF state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTransitionResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /recovery:
    post:
      operationId: recoverAccount
      summary: Consume a one-use operator capability and set a browser-supplied password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
      responses:
        '200':
          description: Password replaced and a fresh browser session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTransitionResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /reauthenticate:
    post:
      operationId: reauthenticate
      summary: Refresh the recent-auth window and rotate browser credential and CSRF state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthenticationRequest'
      responses:
        '200':
          description: Recent-auth window refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTransitionResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /logout:
    post:
      operationId: logout
      summary: Revoke the current server session and clear browser authentication state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAuthRequest'
      responses:
        '200':
          description: Current session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /sessions:
    get:
      operationId: listSessions
      summary: List active account sessions with current and coarse activity markers
      responses:
        '200':
          description: Active session inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /sessions/{session_id}:
    parameters:
      - in: path
        name: session_id
        required: true
        schema:
          $ref: '#/components/schemas/SessionIdentity'
    patch:
      operationId: updateSession
      summary: Change one account-scoped session label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionUpdateRequest'
      responses:
        '200':
          description: Session label updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
    delete:
      operationId: revokeSession
      summary: Revoke one account-scoped session after recent authentication
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /test/session:
    post:
      operationId: createTestSession
      summary: Authenticate the seeded account in an isolated test runtime
      responses:
        '200':
          description: Test browser session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
  /session:
    get:
      operationId: getSession
      summary: Read the authenticated browser bootstrap
      responses:
        '200':
          description: Authenticated browser bootstrap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
  /inbox:
    get:
      operationId: getInbox
      summary: Read active Inbox task snapshots newest first
      responses:
        '200':
          description: Authoritative Inbox task snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
  /tasks/{task_id}:
    get:
      operationId: getTask
      summary: Read one authoritative editable task snapshot
      description: Trashed tasks are intentionally not exposed by this editable-task endpoint.
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/TaskIdentity'
      responses:
        '200':
          description: Authoritative task snapshot independent of list membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSnapshot'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
  /views/inbox:
    get:
      operationId: getInboxView
      summary: Read the deterministic active Inbox projection
      parameters:
        - $ref: '#/components/parameters/TaskViewCursorParameter'
        - $ref: '#/components/parameters/TaskViewLimitParameter'
      responses:
        '200':
          description: Authoritative Inbox projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskViewPage'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
  /today:
    get:
      operationId: getToday
      summary: Read fixed Overdue and Today sections in account time
      parameters:
        - $ref: '#/components/parameters/TaskViewCursorParameter'
        - $ref: '#/components/parameters/TaskViewLimitParameter'
      responses:
        '200':
          description: Authoritative Today projection and scoped order revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskViewPage'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
  /upcoming:
    get:
      operationId: getUpcoming
      summary: Read future planned dates and deadlines grouped in account time
      parameters:
        - $ref: '#/components/parameters/TaskViewCursorParameter'
        - $ref: '#/components/parameters/TaskViewLimitParameter'
      responses:
        '200':
          description: Authoritative read-only Upcoming projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskViewPage'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
  /completed:
    get:
      operationId: getCompleted
      summary: Read completed tasks newest first in account time
      parameters:
        - $ref: '#/components/parameters/TaskViewCursorParameter'
        - $ref: '#/components/parameters/TaskViewLimitParameter'
      responses:
        '200':
          description: Authoritative Completed projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskViewPage'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
  /trash:
    get:
      operationId: getTrash
      summary: Read account-scoped recoverable tasks newest trashed first
      responses:
        '200':
          description: Authoritative recoverable Trash projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
  /organizations:
    get:
      operationId: listOrganizations
      summary: Read account-scoped projects and tags with archived state
      responses:
        '200':
          description: Authoritative project and tag projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationsResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
  /tasks/{task_id}/activity:
    parameters:
      - in: path
        name: task_id
        required: true
        schema:
          $ref: '#/components/schemas/TaskIdentity'
    get:
      operationId: listTaskActivity
      summary: Read canonical accepted task activity newest first
      parameters:
        - in: query
          name: cursor
          required: false
          schema:
            $ref: '#/components/schemas/ActivityCursor'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Account-scoped canonical activity page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/capture-task:
    post:
      operationId: captureTask
      summary: Capture one titled task into explicit Inbox state
      security:
        - DeviceBearer: []
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureTaskCommand'
      responses:
        '201':
          description: Exact stored mutation acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/edit-task:
    post:
      operationId: editTask
      summary: Edit only touched title or notes fields while preserving Inbox state
      security:
        - DeviceBearer: []
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditTaskCommand'
      responses:
        '200':
          description: Exact stored edit acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/resolve-task-conflict:
    post:
      operationId: resolveTaskConflict
      summary: Resolve one persisted affected-field task conflict against its latest revision
      security:
        - DeviceBearer: []
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveTaskConflictCommand'
      responses:
        '200':
          description: Exact stored conflict-resolution acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/clarify-task:
    post:
      operationId: clarifyTask
      summary: Atomically edit touched details and move a task out of Inbox
      security:
        - DeviceBearer: []
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClarifyTaskCommand'
      responses:
        '200':
          description: Exact stored clarification acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/return-to-inbox:
    post:
      operationId: returnToInbox
      summary: Explicitly restore canonical Inbox membership
      security:
        - DeviceBearer: []
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnToInboxCommand'
      responses:
        '200':
          description: Exact stored Inbox-return acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/complete-task:
    post:
      operationId: completeTask
      summary: Complete a task through the revision-aware semantic lifecycle boundary
      security:
        - DeviceBearer: []
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskLifecycleCommand'
      responses:
        '200':
          description: Exact stored completion acknowledgement or already-satisfied result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/reopen-task:
    post:
      operationId: reopenTask
      summary: Reopen a task and recompute active projections from preserved fields
      security:
        - DeviceBearer: []
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskLifecycleCommand'
      responses:
        '200':
          description: Exact stored reopen acknowledgement or already-satisfied result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/trash-task:
    post:
      operationId: trashTask
      summary: Move a task to durable recoverable Trash at its exact revision
      security:
        - DeviceBearer: []
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskLifecycleCommand'
      responses:
        '200':
          description: Exact stored Trash acknowledgement or already-satisfied result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/restore-task:
    post:
      operationId: restoreTask
      summary: Restore a task at its exact revision and return authoritative destinations
      security:
        - DeviceBearer: []
        - BrowserSession: []
      requestBody:
        required: true
        content:
