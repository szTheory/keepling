openapi: 3.1.0
info:
  title: Keepling API
  version: 0.1.0
  description: >-
    Versioned same-origin transport for Keepling semantic commands. Domain,
    persistence, generated wire, and browser view representations remain separate.
servers:
  - url: /api/v1
    description: Same-origin Keepling API
paths:
  /setup:
    post:
      operationId: completeSetup
      summary: Consume the operator-issued capability and create the sole account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '201':
          description: Sole account created and setup permanently disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /login:
    post:
      operationId: login
      summary: Authenticate the closed personal account and rotate browser session state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Browser session established with fresh CSRF state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTransitionResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /recovery:
    post:
      operationId: recoverAccount
      summary: Consume a one-use operator capability and set a browser-supplied password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
      responses:
        '200':
          description: Password replaced and a fresh browser session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTransitionResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /reauthenticate:
    post:
      operationId: reauthenticate
      summary: Refresh the recent-auth window and rotate browser credential and CSRF state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthenticationRequest'
      responses:
        '200':
          description: Recent-auth window refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTransitionResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /logout:
    post:
      operationId: logout
      summary: Revoke the current server session and clear browser authentication state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAuthRequest'
      responses:
        '200':
          description: Current session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /sessions:
    get:
      operationId: listSessions
      summary: List active account sessions with current and coarse activity markers
      responses:
        '200':
          description: Active session inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /sessions/{session_id}:
    parameters:
      - in: path
        name: session_id
        required: true
        schema:
          $ref: '#/components/schemas/SessionIdentity'
    patch:
      operationId: updateSession
      summary: Change one account-scoped session label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionUpdateRequest'
      responses:
        '200':
          description: Session label updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
    delete:
      operationId: revokeSession
      summary: Revoke one account-scoped session after recent authentication
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /test/session:
    post:
      operationId: createTestSession
      summary: Authenticate the seeded account in an isolated test runtime
      responses:
        '200':
          description: Test browser session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
  /session:
    get:
      operationId: getSession
      summary: Read the authenticated browser bootstrap
      responses:
        '200':
          description: Authenticated browser bootstrap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
  /inbox:
    get:
      operationId: getInbox
      summary: Read active Inbox task snapshots newest first
      responses:
        '200':
          description: Authoritative Inbox task snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
  /views/inbox:
    get:
      operationId: getInboxView
      summary: Read the deterministic active Inbox projection
      parameters:
        - $ref: '#/components/parameters/TaskViewCursorParameter'
        - $ref: '#/components/parameters/TaskViewLimitParameter'
      responses:
        '200':
          description: Authoritative Inbox projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskViewPage'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
  /today:
    get:
      operationId: getToday
      summary: Read fixed Overdue and Today sections in account time
      parameters:
        - $ref: '#/components/parameters/TaskViewCursorParameter'
        - $ref: '#/components/parameters/TaskViewLimitParameter'
      responses:
        '200':
          description: Authoritative Today projection and scoped order revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskViewPage'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
  /upcoming:
    get:
      operationId: getUpcoming
      summary: Read future planned dates and deadlines grouped in account time
      parameters:
        - $ref: '#/components/parameters/TaskViewCursorParameter'
        - $ref: '#/components/parameters/TaskViewLimitParameter'
      responses:
        '200':
          description: Authoritative read-only Upcoming projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskViewPage'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
  /completed:
    get:
      operationId: getCompleted
      summary: Read completed tasks newest first in account time
      parameters:
        - $ref: '#/components/parameters/TaskViewCursorParameter'
        - $ref: '#/components/parameters/TaskViewLimitParameter'
      responses:
        '200':
          description: Authoritative Completed projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskViewPage'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
  /trash:
    get:
      operationId: getTrash
      summary: Read account-scoped recoverable tasks newest trashed first
      responses:
        '200':
          description: Authoritative recoverable Trash projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
  /organizations:
    get:
      operationId: listOrganizations
      summary: Read account-scoped projects and tags with archived state
      responses:
        '200':
          description: Authoritative project and tag projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationsResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
  /tasks/{task_id}/activity:
    parameters:
      - in: path
        name: task_id
        required: true
        schema:
          $ref: '#/components/schemas/TaskIdentity'
    get:
      operationId: listTaskActivity
      summary: Read canonical accepted task activity newest first
      parameters:
        - in: query
          name: cursor
          required: false
          schema:
            $ref: '#/components/schemas/ActivityCursor'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Account-scoped canonical activity page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/capture-task:
    post:
      operationId: captureTask
      summary: Capture one titled task into explicit Inbox state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureTaskCommand'
      responses:
        '201':
          description: Exact stored mutation acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/edit-task:
    post:
      operationId: editTask
      summary: Edit only touched title or notes fields while preserving Inbox state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditTaskCommand'
      responses:
        '200':
          description: Exact stored edit acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/resolve-task-conflict:
    post:
      operationId: resolveTaskConflict
      summary: Resolve one persisted affected-field task conflict against its latest revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveTaskConflictCommand'
      responses:
        '200':
          description: Exact stored conflict-resolution acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/clarify-task:
    post:
      operationId: clarifyTask
      summary: Atomically edit touched details and move a task out of Inbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClarifyTaskCommand'
      responses:
        '200':
          description: Exact stored clarification acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/return-to-inbox:
    post:
      operationId: returnToInbox
      summary: Explicitly restore canonical Inbox membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnToInboxCommand'
      responses:
        '200':
          description: Exact stored Inbox-return acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/complete-task:
    post:
      operationId: completeTask
      summary: Complete a task through the revision-aware semantic lifecycle boundary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskLifecycleCommand'
      responses:
        '200':
          description: Exact stored completion acknowledgement or already-satisfied result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/reopen-task:
    post:
      operationId: reopenTask
      summary: Reopen a task and recompute active projections from preserved fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskLifecycleCommand'
      responses:
        '200':
          description: Exact stored reopen acknowledgement or already-satisfied result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/trash-task:
    post:
      operationId: trashTask
      summary: Move a task to durable recoverable Trash at its exact revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskLifecycleCommand'
      responses:
        '200':
          description: Exact stored Trash acknowledgement or already-satisfied result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/restore-task:
    post:
      operationId: restoreTask
      summary: Restore a task at its exact revision and return authoritative destinations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskLifecycleCommand'
      responses:
        '200':
          description: Exact stored restore acknowledgement with actual destinations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/undo-task:
    post:
      operationId: undoTask
      summary: Apply one bounded account-authorized semantic compensation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UndoTaskCommand'
      responses:
        '200':
          description: Exact accepted or explicit no-change undo result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndoResult'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          description: Account-scoped unknown handle result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndoNoChange'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/edit-task-dates:
    post:
      operationId: editTaskDates
      summary: Edit touched planned and deadline civil dates independently
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditTaskDatesRequest'
      responses:
        '200':
          description: Exact stored task-date acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/plan-for-today:
    post:
      operationId: planForToday
      summary: Resolve the configured account day at acceptance and plan the task for it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanForTodayRequest'
      responses:
        '200':
          description: Exact stored Today-planning acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/move-today-task:
    post:
      operationId: moveTodayTask
      summary: Move a task earlier or later within its server-owned Today section
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodayMoveRequest'
      responses:
        '200':
          description: Acknowledged scoped Today order revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayMoveResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/unplan-task:
    post:
      operationId: unplanTask
      summary: Remove deliberate planned placement without changing the deadline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnplanTaskRequest'
      responses:
        '200':
          description: Exact stored unplanning acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/create-organization:
    post:
      operationId: createOrganization
      summary: Create a stable-ID project or tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationCommand'
      responses:
        '201':
          description: Exact stored organization acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/rename-organization:
    post:
      operationId: renameOrganization
      summary: Rename a project or tag by stable identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameOrganizationCommand'
      responses:
        '200':
          description: Exact stored organization acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/archive-organization:
    post:
      operationId: archiveOrganization
      summary: Archive a project or tag by stable identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationLifecycleCommand'
      responses:
        '200':
          description: Exact stored organization acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/unarchive-organization:
    post:
      operationId: unarchiveOrganization
      summary: Unarchive a project or tag by stable identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationLifecycleCommand'
      responses:
        '200':
          description: Exact stored organization acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/assign-task-organizations:
    post:
      operationId: assignTaskOrganizations
      summary: Assign one project and many flat tags by stable identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTaskOrganizationsCommand'
      responses:
        '200':
          description: Exact stored task assignment acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /mutations/{mutation_id}:
    get:
      operationId: getMutation
      summary: Look up the exact stored terminal result by mutation identity
      parameters:
        - in: path
          name: mutation_id
          required: true
          schema:
            $ref: '#/components/schemas/MutationIdentity'
      responses:
        '201':
          description: Original stored accepted acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResult'
        '200':
          description: Original stored update acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResult'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
components:
  parameters:
    TaskViewCursorParameter:
      in: query
      name: cursor
      required: false
      schema:
        $ref: '#/components/schemas/TaskViewCursor'
    TaskViewLimitParameter:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
  responses:
    ProblemResponse:
      description: Closed RFC 9457 problem
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ActivityActor:
      type: object
      additionalProperties: false
      required:
        - label
        - principal
        - type
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
          description: Server-derived human-facing actor label; clients cannot assert it.
        principal:
          type: string
          enum:
            - account_owner
            - authorized_grant
        type:
          type: string
          enum:
            - user
            - agent
    ActivityCursor:
      type: string
      minLength: 1
      maxLength: 1024
      description: Opaque HMAC-authenticated account/task/revision-bound keyset cursor.
    ActivityDateChange:
      type: object
      additionalProperties: false
      required:
        - field
        - kind
        - new
        - old
      properties:
        field:
          type: string
          enum:
            - deadline_on
            - planned_on
        kind:
          type: string
          const: date
        new:
          anyOf:
            - type: string
              format: date
            - type: 'null'
        old:
          anyOf:
            - type: string
              format: date
            - type: 'null'
    ActivityIdentity:
      type: integer
      format: int64
      minimum: 1
    ActivityInstantChange:
      type: object
      additionalProperties: false
      required:
        - field
        - kind
        - new
        - old
      properties:
        field:
          type: string
          enum:
            - completed_at
            - trashed_at
        kind:
          type: string
          const: instant
        new:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        old:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
    ActivityItem:
      type: object
      additionalProperties: false
      required:
        - accepted_at
        - activity_id
        - actor
        - changes
        - client_kind
        - from_revision
        - mutation_id
        - outcome
        - recovery_state
        - to_revision
        - type
        - undone_activity_id
        - version
      properties:
        accepted_at:
          type: string
          format: date-time
        activity_id:
          $ref: '#/components/schemas/ActivityIdentity'
        actor:
          $ref: '#/components/schemas/ActivityActor'
        changes:
          type: array
          minItems: 1
          items:
            oneOf:
              - $ref: '#/components/schemas/ActivityDateChange'
              - $ref: '#/components/schemas/ActivityInstantChange'
              - $ref: '#/components/schemas/ActivityOrganizationChange'
              - $ref: '#/components/schemas/ActivityOrganizationsChange'
              - $ref: '#/components/schemas/ActivityStateChange'
              - $ref: '#/components/schemas/ActivityTextChange'
        client_kind:
          type: string
          enum:
            - web
            - electron
            - iphone
            - mcp
        from_revision:
          anyOf:
            - $ref: '#/components/schemas/Revision'
            - type: 'null'
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        outcome:
          type: string
          const: accepted
        recovery_state:
          type: string
          enum:
            - available
            - not_available
            - undone
            - expired
            - stale
        to_revision:
          $ref: '#/components/schemas/Revision'
        type:
          type: string
          enum:
            - task_captured
            - task_details_updated
            - task_planned
            - task_unplanned
            - task_clarified
            - task_returned_to_inbox
            - task_completed
            - task_reopened
            - task_trashed
            - task_restored
            - task_undo_applied
        undone_activity_id:
          anyOf:
            - $ref: '#/components/schemas/ActivityIdentity'
            - type: 'null'
        version:
          type: integer
          const: 1
    ActivityOrganizationChange:
      type: object
      additionalProperties: false
      required:
        - field
        - kind
        - new
        - old
      properties:
        field:
          type: string
          const: project
        kind:
          type: string
          const: organization
        new:
          anyOf:
            - $ref: '#/components/schemas/TaskOrganizationReference'
            - type: 'null'
        old:
          anyOf:
            - $ref: '#/components/schemas/TaskOrganizationReference'
            - type: 'null'
    ActivityOrganizationsChange:
      type: object
      additionalProperties: false
      required:
        - field
        - kind
        - new
        - old
      properties:
        field:
          type: string
          const: tags
        kind:
          type: string
          const: organizations
        new:
          type: array
          items:
            $ref: '#/components/schemas/TaskOrganizationReference'
        old:
          type: array
          items:
            $ref: '#/components/schemas/TaskOrganizationReference'
    ActivityPage:
      type: object
      additionalProperties: false
      required:
        - account_timezone
        - items
        - next_cursor
      properties:
        account_timezone:
          type: string
          minLength: 1
          description: Canonical IANA timezone used to display accepted activity time.
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ActivityItem'
        next_cursor:
          anyOf:
            - $ref: '#/components/schemas/ActivityCursor'
            - type: 'null'
    ActivityStateChange:
      type: object
      additionalProperties: false
      required:
        - field
        - kind
        - new
        - old
      properties:
        field:
          type: string
          enum:
            - inbox_state
        kind:
          type: string
          const: state
        new:
          anyOf:
            - type: string
            - type: 'null'
        old:
          anyOf:
            - type: string
            - type: 'null'
    ActivityTextChange:
      type: object
      additionalProperties: false
      required:
        - field
        - kind
        - new
        - old
      properties:
        field:
          type: string
          enum:
            - notes
            - title
        kind:
          type: string
          const: text
        new:
          anyOf:
            - type: string
            - type: 'null'
        old:
          anyOf:
            - type: string
            - type: 'null'
    AssignTaskOrganizationsCommand:
      type: object
      additionalProperties: false
      required:
        - base_values
        - expected_revision
        - fields
        - mutation_id
        - task_id
        - version
      properties:
        base_values:
          $ref: '#/components/schemas/OrganizationAssignmentValues'
        expected_revision:
          $ref: '#/components/schemas/Revision'
        fields:
          $ref: '#/components/schemas/OrganizationAssignmentValues'
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        task_id:
          $ref: '#/components/schemas/TaskIdentity'
        version:
          type: integer
          const: 1
    AuthTransitionResponse:
      type: object
      additionalProperties: false
      required:
        - csrf_token
        - status
      properties:
        csrf_token:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - authenticated
            - recently_authenticated
            - recovery_complete
    CaptureTaskCommand:
      type: object
      additionalProperties: false
      required:
        - mutation_id
        - task_id
        - title
        - version
      properties:
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        task_id:
          $ref: '#/components/schemas/TaskIdentity'
        title:
          type: string
          minLength: 1
          maxLength: 512
        version:
          type: integer
          const: 1
    ClarifyTaskCommand:
      $ref: '#/components/schemas/EditTaskCommand'
    CommandAcknowledgement:
      type: object
      additionalProperties: false
      required:
        - mutation_id
        - outcome
        - revision
        - snapshot
        - task_id
        - warnings
      properties:
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        outcome:
          type: string
          enum:
            - accepted
            - already_satisfied
        revision:
          $ref: '#/components/schemas/Revision'
        resolved_conflict_id:
          $ref: '#/components/schemas/ConflictIdentity'
        undo:
          $ref: '#/components/schemas/UndoAvailability'
        snapshot:
          $ref: '#/components/schemas/TaskSnapshot'
        task_id:
          $ref: '#/components/schemas/TaskIdentity'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
    CreateOrganizationCommand:
      type: object
      additionalProperties: false
      required:
        - kind
        - mutation_id
        - name
        - organization_id
        - version
      properties:
        kind:
          $ref: '#/components/schemas/OrganizationKind'
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        name:
          $ref: '#/components/schemas/OrganizationName'
        organization_id:
          $ref: '#/components/schemas/OrganizationIdentity'
        version:
          type: integer
          const: 1
    InboxResponse:
      type: object
      additionalProperties: false
      required:
        - tasks
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskSnapshot'
    TrashResponse:
      type: object
      additionalProperties: false
      required:
        - tasks
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskSnapshot'
    RestoreAcknowledgement:
      type: object
      additionalProperties: false
      required:
        - destinations
        - mutation_id
        - outcome
        - revision
        - snapshot
        - task_id
        - warnings
      properties:
        destinations:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - Inbox
              - Today
              - Upcoming
              - Completed
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        outcome:
          type: string
          enum:
            - accepted
            - already_satisfied
        revision:
          $ref: '#/components/schemas/Revision'
        snapshot:
          $ref: '#/components/schemas/TaskSnapshot'
        task_id:
          $ref: '#/components/schemas/TaskIdentity'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
    TaskViewCursor:
      type: string
      minLength: 1
      maxLength: 2048
      description: Opaque HMAC-authenticated account/view/revision-bound complete keyset.
    TaskViewItem:
      type: object
      additionalProperties: false
      required:
        - captured_at
        - deadline_on
        - id
        - planned_on
        - revision
        - title
      properties:
        captured_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        completed_on:
          type: string
          format: date
        deadline_on:
          $ref: '#/components/schemas/NullableCivilDate'
        group_on:
          type: string
          format: date
        id:
          $ref: '#/components/schemas/TaskIdentity'
        planned_on:
          $ref: '#/components/schemas/NullableCivilDate'
        reasons:
          type: array
          items:
            type: string
            enum:
              - planned_overdue
              - planned_today
              - planned_future
              - deadline_overdue
              - deadline_today
              - deadline_future
        revision:
          $ref: '#/components/schemas/Revision'
        section:
          type: string
          enum:
            - overdue
            - today
            - earlier
        title:
          type: string
        upcoming_reason:
          type: string
          enum:
            - planned
            - deadline
    TaskViewPage:
      type: object
      additionalProperties: false
      required:
        - account_day
        - account_timezone
        - items
        - next_cursor
        - order_revision
        - view
      properties:
        account_day:
          type: string
          format: date
        account_timezone:
          type: string
          minLength: 1
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/TaskViewItem'
        next_cursor:
          anyOf:
            - $ref: '#/components/schemas/TaskViewCursor'
            - type: 'null'
        order_revision:
          anyOf:
            - $ref: '#/components/schemas/Revision'
            - type: 'null'
        view:
          type: string
          enum:
            - inbox
            - today
            - upcoming
            - completed
    TodayMoveRequest:
      type: object
      additionalProperties: false
      required:
        - direction
        - expected_order_revision
        - mutation_id
        - task_id
        - version
      properties:
        direction:
          type: string
          enum:
            - earlier
            - later
        expected_order_revision:
          $ref: '#/components/schemas/Revision'
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        task_id:
          $ref: '#/components/schemas/TaskIdentity'
        version:
          type: integer
          const: 1
    TodayMoveResponse:
      type: object
      additionalProperties: false
      required:
        - order_revision
      properties:
        order_revision:
          $ref: '#/components/schemas/Revision'
    EditTaskCommand:
      type: object
      additionalProperties: false
      required:
        - base_values
        - expected_revision
        - fields
        - mutation_id
        - task_id
        - version
      properties:
        base_values:
          $ref: '#/components/schemas/TaskDetailValues'
        expected_revision:
          $ref: '#/components/schemas/Revision'
        fields:
          $ref: '#/components/schemas/TaskDetailValues'
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        task_id:
          $ref: '#/components/schemas/TaskIdentity'
        version:
          type: integer
          const: 1
    ConflictIdentity:
      type: string
      format: uuid
    ConflictSelection:
      type: string
      enum:
        - current
        - mine
    ConflictSelections:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 2
      properties:
        notes:
          $ref: '#/components/schemas/ConflictSelection'
        title:
          $ref: '#/components/schemas/ConflictSelection'
    ConflictField:
      type: object
      additionalProperties: false
      required:
        - base
        - current
        - field
        - mine
      properties:
        base:
          anyOf:
            - type: string
            - type: 'null'
        current:
          anyOf:
            - type: string
            - type: 'null'
        field:
          type: string
          enum:
            - notes
            - title
        mine:
          anyOf:
            - type: string
            - type: 'null'
    PersistedConflict:
      type: object
      additionalProperties: false
      required:
        - fields
        - id
        - latest_revision
      properties:
        fields:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/ConflictField'
        id:
          $ref: '#/components/schemas/ConflictIdentity'
        latest_revision:
          $ref: '#/components/schemas/Revision'
    ResolveTaskConflictCommand:
      type: object
      additionalProperties: false
      required:
        - conflict_id
        - latest_revision
        - mutation_id
        - selections
        - task_id
        - version
      properties:
        conflict_id:
          $ref: '#/components/schemas/ConflictIdentity'
        latest_revision:
          $ref: '#/components/schemas/Revision'
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        selections:
          $ref: '#/components/schemas/ConflictSelections'
        task_id:
          $ref: '#/components/schemas/TaskIdentity'
        version:
          type: integer
          const: 1
    EditTaskDatesRequest:
      type: object
      additionalProperties: false
      required:
        - base_values
        - expected_revision
        - fields
        - mutation_id
        - task_id
        - version
      properties:
        base_values:
          $ref: '#/components/schemas/TaskDateValues'
        expected_revision:
          $ref: '#/components/schemas/Revision'
        fields:
          $ref: '#/components/schemas/TaskDateValues'
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        task_id:
          $ref: '#/components/schemas/TaskIdentity'
        version:
          type: integer
          const: 1
    PlanForTodayRequest:
      type: object
      additionalProperties: false
      required:
        - base_planned_on
        - expected_revision
        - mutation_id
        - task_id
        - version
      properties:
        base_planned_on:
          $ref: '#/components/schemas/NullableCivilDate'
        expected_revision:
          $ref: '#/components/schemas/Revision'
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        task_id:
          $ref: '#/components/schemas/TaskIdentity'
        version:
          type: integer
          const: 1
    UnplanTaskRequest:
      $ref: '#/components/schemas/PlanForTodayRequest'
    UndoAvailability:
      type: object
      additionalProperties: false
      required:
        - expires_at
        - handle
        - label
      properties:
        expires_at:
          type: string
          format: date-time
        handle:
          $ref: '#/components/schemas/UndoHandle'
        label:
          type: string
          minLength: 1
          maxLength: 200
          description: Precise action-object recovery copy derived by the server.
    UndoHandle:
      type: string
      minLength: 43
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
      description: Opaque account-bound one-shot capability; possession never authorizes use.
    UndoNoChange:
      type: object
      additionalProperties: false
      required:
        - code
        - mutation_id
        - outcome
        - recovery_action
        - retryable
        - title
      properties:
        code:
          type: string
          enum:
            - undo_already_applied
            - undo_expired
            - undo_stale
            - undo_uncertain
            - undo_unknown
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        outcome:
          type: string
          enum:
            - already_applied
            - expired
            - stale
            - uncertain
            - unknown
        recovery_action:
          anyOf:
            - type: string
              enum:
                - check_mutation_result
                - review_latest_task
            - type: 'null'
        retryable:
          type: boolean
        title:
          type: string
          minLength: 1
          maxLength: 200
    UndoResult:
      oneOf:
        - $ref: '#/components/schemas/CommandAcknowledgement'
        - $ref: '#/components/schemas/UndoNoChange'
    UndoTaskCommand:
      type: object
      additionalProperties: false
      required:
        - handle
        - mutation_id
        - version
      properties:
        handle:
          $ref: '#/components/schemas/UndoHandle'
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        version:
          type: integer
          const: 1
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - client_kind
        - label
        - password
        - version
      properties:
        client_kind:
          type: string
          const: web
        label:
          $ref: '#/components/schemas/SessionLabel'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
        version:
          type: integer
          const: 1
    MutationIdentity:
      type: string
      format: uuid
      description: Client-generated identity retained across exact retries.
    MutationResult:
      oneOf:
        - $ref: '#/components/schemas/CommandAcknowledgement'
        - $ref: '#/components/schemas/OrganizationAcknowledgement'
        - $ref: '#/components/schemas/UndoNoChange'
    OrganizationAcknowledgement:
      type: object
      additionalProperties: false
      required:
        - mutation_id
        - organization_id
        - outcome
        - revision
        - snapshot
      properties:
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        organization_id:
          $ref: '#/components/schemas/OrganizationIdentity'
        outcome:
          type: string
          enum:
            - accepted
            - already_satisfied
        revision:
          $ref: '#/components/schemas/Revision'
        snapshot:
          $ref: '#/components/schemas/OrganizationSnapshot'
    OrganizationAssignmentValues:
      type: object
      additionalProperties: false
      required:
        - project_id
        - tag_ids
      properties:
        project_id:
          anyOf:
            - $ref: '#/components/schemas/OrganizationIdentity'
            - type: 'null'
        tag_ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/OrganizationIdentity'
    OrganizationIdentity:
      type: string
      format: uuid
    OrganizationKind:
      type: string
      enum:
        - project
        - tag
    OrganizationLifecycleCommand:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - mutation_id
        - organization_id
        - version
      properties:
        expected_revision:
          $ref: '#/components/schemas/Revision'
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        organization_id:
          $ref: '#/components/schemas/OrganizationIdentity'
        version:
          type: integer
          const: 1
    OrganizationName:
      type: string
      minLength: 1
      maxLength: 200
      description: Display text; active equivalence version 1 is NFC, outer trim, then Unicode case-fold.
    OrganizationsResponse:
      type: object
      additionalProperties: false
      required:
        - organizations
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationSnapshot'
    OrganizationSnapshot:
      type: object
      additionalProperties: false
      required:
        - archived
        - assignable
        - id
        - kind
        - name
        - revision
      properties:
        archived:
          type: boolean
        assignable:
          type: boolean
        id:
          $ref: '#/components/schemas/OrganizationIdentity'
        kind:
          $ref: '#/components/schemas/OrganizationKind'
        name:
          $ref: '#/components/schemas/OrganizationName'
        revision:
          $ref: '#/components/schemas/Revision'
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - retryable
        - recovery_action
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
        retryable:
          type: boolean
        recovery_action:
          type: string
        affected_fields:
          type: array
          items:
            type: string
            enum:
              - completed_at
              - inbox_state
              - notes
              - project_id
              - tag_ids
              - title
              - trashed_at
        active_unfinished_task_count:
          type: integer
          minimum: 0
        current_revision:
          $ref: '#/components/schemas/Revision'
        conflict:
          $ref: '#/components/schemas/PersistedConflict'
    RenameOrganizationCommand:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - mutation_id
        - name
        - organization_id
        - version
      properties:
        expected_revision:
          $ref: '#/components/schemas/Revision'
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        name:
          $ref: '#/components/schemas/OrganizationName'
        organization_id:
          $ref: '#/components/schemas/OrganizationIdentity'
        version:
          type: integer
          const: 1
    Revision:
      type: integer
      format: int64
      minimum: 1
    RecoveryRequest:
      type: object
      additionalProperties: false
      required:
        - client_kind
        - label
        - password
        - token
        - version
      properties:
        client_kind:
          type: string
          const: web
        label:
          $ref: '#/components/schemas/SessionLabel'
        password:
          type: string
          minLength: 12
          maxLength: 1024
          format: password
        token:
          type: string
          minLength: 43
          maxLength: 43
        version:
          type: integer
          const: 1
    ReauthenticationRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - version
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
        version:
          type: integer
          const: 1
    ReturnToInboxCommand:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - mutation_id
        - task_id
        - version
      properties:
        expected_revision:
          $ref: '#/components/schemas/Revision'
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        task_id:
          $ref: '#/components/schemas/TaskIdentity'
        version:
          type: integer
          const: 1
    SessionIdentity:
      type: string
      format: uuid
    SessionLabel:
      type: string
      minLength: 1
      maxLength: 200
    SessionMutationResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        label:
          $ref: '#/components/schemas/SessionLabel'
        status:
          type: string
          enum:
            - session_updated
            - session_revoked
            - signed_out
    SessionResponse:
      type: object
      additionalProperties: false
      required:
        - csrf_token
      properties:
        csrf_token:
          type: string
          minLength: 1
    SessionsResponse:
      type: object
      additionalProperties: false
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/TrackedSession'
    SessionUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - label
        - version
      properties:
        label:
          $ref: '#/components/schemas/SessionLabel'
        version:
          type: integer
          const: 1
    SetupRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - timezone
        - token
        - version
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 1024
          format: password
        timezone:
          type: string
          minLength: 1
          description: Explicit valid IANA timezone; device and deployment defaults are not used.
          examples:
            - America/New_York
        token:
          type: string
          minLength: 43
          maxLength: 43
          description: Short-lived operator-issued setup capability.
        version:
          type: integer
          const: 1
    SetupResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - timezone
      properties:
        status:
          type: string
          const: setup_complete
        timezone:
          type: string
    TaskIdentity:
      type: string
      format: uuid
    TaskLifecycleCommand:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - mutation_id
        - task_id
        - version
      properties:
        expected_revision:
          $ref: '#/components/schemas/Revision'
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        task_id:
          $ref: '#/components/schemas/TaskIdentity'
        version:
          type: integer
          const: 1
    TaskDetailValues:
      type: object
      additionalProperties: false
      properties:
        notes:
          type: string
          maxLength: 50000
        title:
          type: string
          minLength: 1
          maxLength: 512
    CivilDate:
      type: string
      format: date
      description: Canonical civil date with no time or device-zone interpretation.
    NullableCivilDate:
      anyOf:
        - $ref: '#/components/schemas/CivilDate'
        - type: 'null'
    TaskDateValues:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 2
      properties:
        deadline_on:
          $ref: '#/components/schemas/NullableCivilDate'
        planned_on:
          $ref: '#/components/schemas/NullableCivilDate'
    TaskSnapshot:
      type: object
      additionalProperties: false
      required:
        - captured_at
        - completed_at
        - deadline_on
        - id
        - inbox_state
        - notes
        - planned_on
        - project
        - revision
        - tags
        - title
        - trashed_at
      properties:
        captured_at:
          type: string
          format: date-time
        completed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        deadline_on:
          $ref: '#/components/schemas/NullableCivilDate'
        id:
          $ref: '#/components/schemas/TaskIdentity'
        inbox_state:
          type: string
          enum:
            - inbox
            - clarified
        notes:
          type: string
        planned_on:
          $ref: '#/components/schemas/NullableCivilDate'
        project:
          anyOf:
            - $ref: '#/components/schemas/TaskOrganizationReference'
            - type: 'null'
        revision:
          $ref: '#/components/schemas/Revision'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TaskOrganizationReference'
        title:
          type: string
        trashed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
    TaskOrganizationReference:
      type: object
      additionalProperties: false
      required:
        - archived
        - id
        - name
      properties:
        archived:
          type: boolean
        id:
          $ref: '#/components/schemas/OrganizationIdentity'
        name:
          $ref: '#/components/schemas/OrganizationName'
    TrackedSession:
      type: object
      additionalProperties: false
      required:
        - client_kind
        - coarse_activity
        - created_at
        - current
        - id
        - label
      properties:
        client_kind:
          type: string
          enum:
            - web
            - electron
            - iphone
            - mcp
        coarse_activity:
          type: string
          enum:
            - active_now
            - today
            - earlier
        created_at:
          type: string
          format: date-time
        current:
          type: boolean
        id:
          $ref: '#/components/schemas/SessionIdentity'
        label:
          $ref: '#/components/schemas/SessionLabel'
    VersionedAuthRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          const: 1
    Warning:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - planned_after_deadline
        message:
          type: string
