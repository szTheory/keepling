openapi: 3.1.0
info:
  title: Keepling API
  version: 0.1.0
  description: >-
    Versioned same-origin transport for Keepling semantic commands. Domain,
    persistence, generated wire, and browser view representations remain separate.
servers:
  - url: /api/v1
    description: Same-origin Keepling API
paths:
  /setup:
    post:
      operationId: completeSetup
      summary: Consume the operator-issued capability and create the sole account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '201':
          description: Sole account created and setup permanently disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /login:
    post:
      operationId: login
      summary: Authenticate the closed personal account and rotate browser session state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Browser session established with fresh CSRF state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTransitionResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /recovery:
    post:
      operationId: recoverAccount
      summary: Consume a one-use operator capability and set a browser-supplied password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
      responses:
        '200':
          description: Password replaced and a fresh browser session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTransitionResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /reauthenticate:
    post:
      operationId: reauthenticate
      summary: Refresh the recent-auth window and rotate browser credential and CSRF state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthenticationRequest'
      responses:
        '200':
          description: Recent-auth window refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTransitionResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /logout:
    post:
      operationId: logout
      summary: Revoke the current server session and clear browser authentication state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAuthRequest'
      responses:
        '200':
          description: Current session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /sessions:
    get:
      operationId: listSessions
      summary: List active account sessions with current and coarse activity markers
      responses:
        '200':
          description: Active session inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /sessions/{session_id}:
    parameters:
      - in: path
        name: session_id
        required: true
        schema:
          $ref: '#/components/schemas/SessionIdentity'
    patch:
      operationId: updateSession
      summary: Change one account-scoped session label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionUpdateRequest'
      responses:
        '200':
          description: Session label updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
    delete:
      operationId: revokeSession
      summary: Revoke one account-scoped session after recent authentication
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /test/session:
    post:
      operationId: createTestSession
      summary: Authenticate the seeded account in an isolated test runtime
      responses:
        '200':
          description: Test browser session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
  /session:
    get:
      operationId: getSession
      summary: Read the authenticated browser bootstrap
      responses:
        '200':
          description: Authenticated browser bootstrap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
  /inbox:
    get:
      operationId: getInbox
      summary: Read active Inbox tasks newest first
      responses:
        '200':
          description: Authoritative Inbox projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
  /organizations:
    get:
      operationId: listOrganizations
      summary: Read account-scoped projects and tags with archived state
      responses:
        '200':
          description: Authoritative project and tag projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationsResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
  /commands/capture-task:
    post:
      operationId: captureTask
      summary: Capture one titled task into explicit Inbox state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureTaskCommand'
      responses:
        '201':
          description: Exact stored mutation acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/edit-task:
    post:
      operationId: editTask
      summary: Edit only touched title or notes fields while preserving Inbox state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditTaskCommand'
      responses:
        '200':
          description: Exact stored edit acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/clarify-task:
    post:
      operationId: clarifyTask
      summary: Atomically edit touched details and move a task out of Inbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClarifyTaskCommand'
      responses:
        '200':
          description: Exact stored clarification acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/return-to-inbox:
    post:
      operationId: returnToInbox
      summary: Explicitly restore canonical Inbox membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnToInboxCommand'
      responses:
        '200':
          description: Exact stored Inbox-return acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/create-organization:
    post:
      operationId: createOrganization
      summary: Create a stable-ID project or tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationCommand'
      responses:
        '201':
          description: Exact stored organization acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/rename-organization:
    post:
      operationId: renameOrganization
      summary: Rename a project or tag by stable identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameOrganizationCommand'
      responses:
        '200':
          description: Exact stored organization acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/archive-organization:
    post:
      operationId: archiveOrganization
      summary: Archive a project or tag by stable identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationLifecycleCommand'
      responses:
        '200':
          description: Exact stored organization acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/unarchive-organization:
    post:
      operationId: unarchiveOrganization
      summary: Unarchive a project or tag by stable identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationLifecycleCommand'
      responses:
        '200':
          description: Exact stored organization acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /commands/assign-task-organizations:
    post:
      operationId: assignTaskOrganizations
      summary: Assign one project and many flat tags by stable identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTaskOrganizationsCommand'
      responses:
        '200':
          description: Exact stored task assignment acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcknowledgement'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /mutations/{mutation_id}:
    get:
      operationId: getMutation
      summary: Look up the exact stored terminal result by mutation identity
      parameters:
        - in: path
          name: mutation_id
          required: true
          schema:
            $ref: '#/components/schemas/MutationIdentity'
      responses:
        '201':
          description: Original stored accepted acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResult'
        '200':
          description: Original stored update acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResult'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
components:
  responses:
    ProblemResponse:
      description: Closed RFC 9457 problem
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AssignTaskOrganizationsCommand:
      type: object
      additionalProperties: false
      required:
        - base_values
        - expected_revision
        - fields
        - mutation_id
        - task_id
        - version
      properties:
        base_values:
          $ref: '#/components/schemas/OrganizationAssignmentValues'
        expected_revision:
          $ref: '#/components/schemas/Revision'
        fields:
          $ref: '#/components/schemas/OrganizationAssignmentValues'
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        task_id:
          $ref: '#/components/schemas/TaskIdentity'
        version:
          type: integer
          const: 1
    AuthTransitionResponse:
      type: object
      additionalProperties: false
      required:
        - csrf_token
        - status
      properties:
        csrf_token:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - authenticated
            - recently_authenticated
            - recovery_complete
    CaptureTaskCommand:
      type: object
      additionalProperties: false
      required:
        - mutation_id
        - task_id
        - title
        - version
      properties:
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        task_id:
          $ref: '#/components/schemas/TaskIdentity'
        title:
          type: string
          minLength: 1
          maxLength: 512
        version:
          type: integer
          const: 1
    ClarifyTaskCommand:
      $ref: '#/components/schemas/EditTaskCommand'
    CommandAcknowledgement:
      type: object
      additionalProperties: false
      required:
        - mutation_id
        - outcome
        - revision
        - snapshot
        - task_id
        - warnings
      properties:
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        outcome:
          type: string
          enum:
            - accepted
            - already_satisfied
        revision:
          $ref: '#/components/schemas/Revision'
        snapshot:
          $ref: '#/components/schemas/TaskSnapshot'
        task_id:
          $ref: '#/components/schemas/TaskIdentity'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
    CreateOrganizationCommand:
      type: object
      additionalProperties: false
      required:
        - kind
        - mutation_id
        - name
        - organization_id
        - version
      properties:
        kind:
          $ref: '#/components/schemas/OrganizationKind'
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        name:
          $ref: '#/components/schemas/OrganizationName'
        organization_id:
          $ref: '#/components/schemas/OrganizationIdentity'
        version:
          type: integer
          const: 1
    InboxResponse:
      type: object
      additionalProperties: false
      required:
        - tasks
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskSnapshot'
    EditTaskCommand:
      type: object
      additionalProperties: false
      required:
        - base_values
        - expected_revision
        - fields
        - mutation_id
        - task_id
        - version
      properties:
        base_values:
          $ref: '#/components/schemas/TaskDetailValues'
        expected_revision:
          $ref: '#/components/schemas/Revision'
        fields:
          $ref: '#/components/schemas/TaskDetailValues'
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        task_id:
          $ref: '#/components/schemas/TaskIdentity'
        version:
          type: integer
          const: 1
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - client_kind
        - label
        - password
        - version
      properties:
        client_kind:
          type: string
          const: web
        label:
          $ref: '#/components/schemas/SessionLabel'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
        version:
          type: integer
          const: 1
    MutationIdentity:
      type: string
      format: uuid
      description: Client-generated identity retained across exact retries.
    MutationResult:
      oneOf:
        - $ref: '#/components/schemas/CommandAcknowledgement'
        - $ref: '#/components/schemas/OrganizationAcknowledgement'
    OrganizationAcknowledgement:
      type: object
      additionalProperties: false
      required:
        - mutation_id
        - organization_id
        - outcome
        - revision
        - snapshot
      properties:
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        organization_id:
          $ref: '#/components/schemas/OrganizationIdentity'
        outcome:
          type: string
          enum:
            - accepted
            - already_satisfied
        revision:
          $ref: '#/components/schemas/Revision'
        snapshot:
          $ref: '#/components/schemas/OrganizationSnapshot'
    OrganizationAssignmentValues:
      type: object
      additionalProperties: false
      required:
        - project_id
        - tag_ids
      properties:
        project_id:
          anyOf:
            - $ref: '#/components/schemas/OrganizationIdentity'
            - type: 'null'
        tag_ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/OrganizationIdentity'
    OrganizationIdentity:
      type: string
      format: uuid
    OrganizationKind:
      type: string
      enum:
        - project
        - tag
    OrganizationLifecycleCommand:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - mutation_id
        - organization_id
        - version
      properties:
        expected_revision:
          $ref: '#/components/schemas/Revision'
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        organization_id:
          $ref: '#/components/schemas/OrganizationIdentity'
        version:
          type: integer
          const: 1
    OrganizationName:
      type: string
      minLength: 1
      maxLength: 200
      description: Display text; active equivalence version 1 is NFC, outer trim, then Unicode case-fold.
    OrganizationsResponse:
      type: object
      additionalProperties: false
      required:
        - organizations
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationSnapshot'
    OrganizationSnapshot:
      type: object
      additionalProperties: false
      required:
        - archived
        - assignable
        - id
        - kind
        - name
        - revision
      properties:
        archived:
          type: boolean
        assignable:
          type: boolean
        id:
          $ref: '#/components/schemas/OrganizationIdentity'
        kind:
          $ref: '#/components/schemas/OrganizationKind'
        name:
          $ref: '#/components/schemas/OrganizationName'
        revision:
          $ref: '#/components/schemas/Revision'
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - retryable
        - recovery_action
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
        retryable:
          type: boolean
        recovery_action:
          type: string
        affected_fields:
          type: array
          items:
            type: string
            enum:
              - inbox_state
              - notes
              - project_id
              - tag_ids
              - title
        active_unfinished_task_count:
          type: integer
          minimum: 0
        current_revision:
          $ref: '#/components/schemas/Revision'
    RenameOrganizationCommand:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - mutation_id
        - name
        - organization_id
        - version
      properties:
        expected_revision:
          $ref: '#/components/schemas/Revision'
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        name:
          $ref: '#/components/schemas/OrganizationName'
        organization_id:
          $ref: '#/components/schemas/OrganizationIdentity'
        version:
          type: integer
          const: 1
    Revision:
      type: integer
      format: int64
      minimum: 1
    RecoveryRequest:
      type: object
      additionalProperties: false
      required:
        - client_kind
        - label
        - password
        - token
        - version
      properties:
        client_kind:
          type: string
          const: web
        label:
          $ref: '#/components/schemas/SessionLabel'
        password:
          type: string
          minLength: 12
          maxLength: 1024
          format: password
        token:
          type: string
          minLength: 43
          maxLength: 43
        version:
          type: integer
          const: 1
    ReauthenticationRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - version
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
        version:
          type: integer
          const: 1
    ReturnToInboxCommand:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - mutation_id
        - task_id
        - version
      properties:
        expected_revision:
          $ref: '#/components/schemas/Revision'
        mutation_id:
          $ref: '#/components/schemas/MutationIdentity'
        task_id:
          $ref: '#/components/schemas/TaskIdentity'
        version:
          type: integer
          const: 1
    SessionIdentity:
      type: string
      format: uuid
    SessionLabel:
      type: string
      minLength: 1
      maxLength: 200
    SessionMutationResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        label:
          $ref: '#/components/schemas/SessionLabel'
        status:
          type: string
          enum:
            - session_updated
            - session_revoked
            - signed_out
    SessionResponse:
      type: object
      additionalProperties: false
      required:
        - csrf_token
      properties:
        csrf_token:
          type: string
          minLength: 1
    SessionsResponse:
      type: object
      additionalProperties: false
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/TrackedSession'
    SessionUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - label
        - version
      properties:
        label:
          $ref: '#/components/schemas/SessionLabel'
        version:
          type: integer
          const: 1
    SetupRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - timezone
        - token
        - version
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 1024
          format: password
        timezone:
          type: string
          minLength: 1
          description: Explicit valid IANA timezone; device and deployment defaults are not used.
          examples:
            - America/New_York
        token:
          type: string
          minLength: 43
          maxLength: 43
          description: Short-lived operator-issued setup capability.
        version:
          type: integer
          const: 1
    SetupResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - timezone
      properties:
        status:
          type: string
          const: setup_complete
        timezone:
          type: string
    TaskIdentity:
      type: string
      format: uuid
    TaskDetailValues:
      type: object
      additionalProperties: false
      properties:
        notes:
          type: string
          maxLength: 50000
        title:
          type: string
          minLength: 1
          maxLength: 512
    TaskSnapshot:
      type: object
      additionalProperties: false
      required:
        - captured_at
        - id
        - inbox_state
        - notes
        - project
        - revision
        - tags
        - title
      properties:
        captured_at:
          type: string
          format: date-time
        id:
          $ref: '#/components/schemas/TaskIdentity'
        inbox_state:
          type: string
          enum:
            - inbox
            - clarified
        notes:
          type: string
        project:
          anyOf:
            - $ref: '#/components/schemas/TaskOrganizationReference'
            - type: 'null'
        revision:
          $ref: '#/components/schemas/Revision'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TaskOrganizationReference'
        title:
          type: string
    TaskOrganizationReference:
      type: object
      additionalProperties: false
      required:
        - archived
        - id
        - name
      properties:
        archived:
          type: boolean
        id:
          $ref: '#/components/schemas/OrganizationIdentity'
        name:
          $ref: '#/components/schemas/OrganizationName'
    TrackedSession:
      type: object
      additionalProperties: false
      required:
        - client_kind
        - coarse_activity
        - created_at
        - current
        - id
        - label
      properties:
        client_kind:
          type: string
          enum:
            - web
            - electron
            - iphone
            - mcp
        coarse_activity:
          type: string
          enum:
            - active_now
            - today
            - earlier
        created_at:
          type: string
          format: date-time
        current:
          type: boolean
        id:
          $ref: '#/components/schemas/SessionIdentity'
        label:
          $ref: '#/components/schemas/SessionLabel'
    VersionedAuthRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          const: 1
    Warning:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
