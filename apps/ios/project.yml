# XcodeGen source of truth for Keepling.xcodeproj (never hand-edited).
# Regenerate with: xcodegen generate --spec apps/ios/project.yml --project apps/ios
name: Keepling
options:
  bundleIdPrefix: com.szTheory
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

# Signing lives in an xcconfig, never in this file: project.yml is committed and
# an Apple Team ID would tie the published repo to a specific Apple account.
# Signing.xcconfig optionally includes gitignored Signing.local.xcconfig.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

packages:
  KeeplingCore:
    path: .

targets:
  Keepling:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/Keepling
    dependencies:
      - package: KeeplingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.szTheory.keepling
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.3"
        # D-21: a build-digest string the running process can read back at
        # verification time (Plan 04-16 physical-device evidence binding).
        # Set from a build setting rather than hand-maintained so it always
        # reflects the actual build, never a stale hand-edited literal.
        KEEPLING_BUILD_DIGEST: "$(MARKETING_VERSION)+$(CURRENT_PROJECT_VERSION)"
    info:
      path: Sources/Keepling/App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        KeeplingBuildDigest: "$(KEEPLING_BUILD_DIGEST)"
        # D-31: reject the legacy shake-to-undo/edit menu gesture. Keepling's
        # undo is a named, persistent control (D-30), never a shake gesture.
        UIApplicationSupportsShakeToEdit: false
        # 04-07-PLAN.md Task 1: the registered ASWebAuthenticationSession
        # callback scheme for the native device-grant PKCE flow. This app's
        # callback (`keepling://ios/auth/callback`) is distinct from the
        # desktop's `keepling://auth/callback`
        # (apps/desktop/main/adapters/auth.ts) by HOST, not by scheme: the
        # server's redirect_uris!/1 allowlist validator requires every entry
        # to be an exact private-use `keepling://host/path` URI. A
        # private-use scheme is first-come per-OS, so sharing `keepling`
        # with the Mac client cannot collide -- they never register on the
        # same OS.
        CFBundleURLTypes:
          - CFBundleURLName: com.szTheory.keepling.auth
            CFBundleURLSchemes:
              - keepling
        # 04-08-PLAN.md Task 3: the background refresh task identifier and
        # capability the scene-phase driver's background path uses to
        # accelerate (never require) sync-pass correctness. D-44 keeps
        # every other background/notification surface out of this phase --
        # only the `fetch` background mode below is declared; no push
        # entitlement, no other background mode, no permission-prompting
        # notification framework, and no push-notification-service
        # entitlement of any kind.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.szTheory.keepling.sync-refresh

  KeeplingCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/KeeplingCoreTests
    dependencies:
      # 04-08-PLAN.md Task 3: BackgroundAccelerationTests exercises
      # ScenePhaseDriver/BackgroundRefresh, which live in the Keepling app
      # target (they import SwiftUI/BackgroundTasks, outside KeeplingCore's
      # own "no UIKit, no SwiftUI" package constraint) -- mirrors
      # AppIntentsTests' own host-app-linked test target below. Depending
      # on `target: Keepling` ALONE (not also `package: KeeplingCore`
      # directly) avoids linking KeeplingCore twice -- Keepling already
      # depends on the package, so KeeplingCoreTests gets it transitively
      # through the host-app link (`BUNDLE_LOADER`/`TEST_HOST` below).
      - target: Keepling
    settings:
      base:
        SWIFT_VERSION: "6.3"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Keepling.app/Keepling"

  StorageTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/StorageTests
    dependencies:
      # HOSTED by the app, matching `KeeplingCoreTests` and `AppIntentsTests`
      # above. iOS refuses tool-hosted (unhosted) test bundles on device
      # destinations -- "Tool-hosted testing is unavailable on device
      # destinations" -- so an unhosted StorageTests is silently SKIPPED
      # there. That is how `DataProtectionTests` came to be cited as
      # physical-device evidence for gate G7 while never executing on
      # hardware at all, and file data protection is a property of a real
      # passcode-bearing device that no simulator run can stand in for.
      #
      # `target: Keepling` ALONE, deliberately -- see `KeeplingCoreTests`'
      # note: the app already depends on the package, so this bundle gets
      # KeeplingCore transitively through the host-app link. Keeping
      # `package: KeeplingCore` here as well links it twice and the build
      # fails on KeeplingCore's transitive SwiftPM products (measured:
      # "Undefined symbol: type metadata for HTTPTypes.HTTPRequest").
      - target: Keepling
    settings:
      base:
        SWIFT_VERSION: "6.3"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Keepling.app/Keepling"

  KeeplingUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/KeeplingUITests
    dependencies:
      - target: Keepling
      # 04-10-PLAN.md Task 1: AnnouncementTests.swift is a plain XCTestCase
      # (no XCUIApplication launch) unit-testing AnnouncementDebouncer
      # directly, so it needs KeeplingCore's compiled module at compile
      # time -- `target: Keepling` alone (a UI-test host-app link) does not
      # provide that; the equivalent unit-test targets above depend on the
      # package directly for the same reason.
      - package: KeeplingCore
    settings:
      base:
        SWIFT_VERSION: "6.3"
        TEST_TARGET_NAME: Keepling
        GENERATE_INFOPLIST_FILE: YES

  AppIntentsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/AppIntentsTests
    dependencies:
      - target: Keepling
    settings:
      base:
        SWIFT_VERSION: "6.3"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Keepling.app/Keepling"

schemes:
  Keepling:
    build:
      targets:
        Keepling: all
        KeeplingCoreTests: [test]
        StorageTests: [test]
        KeeplingUITests: [test]
        AppIntentsTests: [test]
    test:
      targets:
        - KeeplingCoreTests
        - StorageTests
        - KeeplingUITests
        - AppIntentsTests
