#cloud-config
# Bootstrap is intentionally bounded to replaceable runtime prerequisites. It
# contains no credentials, database contents, backup material, or private key.
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - jq
  - docker.io
  - docker-compose-v2

write_files:
  - path: /etc/keepling/release.env
    owner: root:root
    permissions: "0644"
    content: |
      KEEPLING_TESTED_OCI_DIGEST=${tested_oci_digest}
      KEEPLING_TARGET_ARCHITECTURE=${architecture}
  - path: /usr/local/libexec/keepling-runtime-probe
    owner: root:root
    permissions: "0755"
    encoding: b64
    content: ${runtime_probe_base64}
  - path: /usr/local/libexec/keepling-semantic-proof
    owner: root:root
    permissions: "0755"
    encoding: b64
    content: ${semantic_probe_base64}
  - path: /usr/local/sbin/keepling-bootstrap
    owner: root:root
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu
      install -d -o root -g root -m 0755 /srv/keepling
      install -d -o root -g root -m 0700 /etc/keepling/secrets /etc/keepling/recovery
      install -d -o root -g root -m 0700 /var/lib/keepling
      systemctl enable --now docker.service
      systemctl is-enabled --quiet docker.service
      systemctl is-active --quiet docker.service
      test "$(stat -c '%U:%G:%a' /srv/keepling)" = "root:root:755"
      test "$(stat -c '%U:%G:%a' /etc/keepling/secrets)" = "root:root:700"
      test "$(stat -c '%U:%G:%a' /etc/keepling/recovery)" = "root:root:700"
      test "$(stat -c '%U:%G:%a' /var/lib/keepling)" = "root:root:700"
      test "$(stat -c '%U:%G:%a' /usr/local/libexec/keepling-runtime-probe)" = "root:root:755"
      test "$(stat -c '%U:%G:%a' /usr/local/libexec/keepling-semantic-proof)" = "root:root:755"
      test "$(sha256sum /usr/local/libexec/keepling-runtime-probe | awk '{print $1}')" = '${runtime_probe_sha256}'
      test "$(sha256sum /usr/local/libexec/keepling-semantic-proof | awk '{print $1}')" = '${semantic_probe_sha256}'
      grep -Fx 'KEEPLING_TESTED_OCI_DIGEST=${tested_oci_digest}' /etc/keepling/release.env >/dev/null
      grep -Fx 'KEEPLING_TARGET_ARCHITECTURE=${architecture}' /etc/keepling/release.env >/dev/null
      sentinel_tmp=$(mktemp /var/lib/keepling/.bootstrap-complete.XXXXXX)
      trap 'rm -f -- "$sentinel_tmp"' EXIT HUP INT TERM
      printf '%s\n' '{"version":1,"status":"complete","runtime_probe_sha256":"${runtime_probe_sha256}","semantic_probe_sha256":"${semantic_probe_sha256}"}' >"$sentinel_tmp"
      chown root:root "$sentinel_tmp"
      chmod 0600 "$sentinel_tmp"
      mv -f "$sentinel_tmp" /var/lib/keepling/bootstrap-complete.json
      sentinel_tmp=
      trap - EXIT HUP INT TERM
      test "$(stat -c '%U:%G:%a' /var/lib/keepling/bootstrap-complete.json)" = "root:root:600"
  - path: /usr/local/sbin/keepling-show-host-key-fingerprint
    owner: root:root
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu
      fingerprint=$(ssh-keygen -E sha256 -lf /etc/ssh/ssh_host_ed25519_key.pub | awk '{print $2}')
      printf '\nKeepling SSH host fingerprint: %s\n' "$fingerprint" >> /etc/issue
      systemctl restart getty@tty1.service

runcmd:
  - [flock, --wait, "120", /run/keepling-bootstrap.lock, /usr/local/sbin/keepling-bootstrap]
  - [/usr/local/sbin/keepling-show-host-key-fingerprint]

final_message: "Keepling replaceable-host runtime prerequisites are ready"
